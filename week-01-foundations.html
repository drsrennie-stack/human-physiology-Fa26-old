/* =====================================================================
   THE CLINICAL PHYSIOLOGY LAB, shared engine
   Part 2 of 2: decision charts, matching, calculation tables, plotting,
   the written test, the results page and the PDF submission.
   ===================================================================== */
(function () {
'use strict';
var L = window.LAB, el = L.el, $ = L.$, $$ = L.$$, fmt = L.fmt, C = L.COLOR;

/* =====================================================================
   CLICKABLE DECISION CHART
   Built the way an ACLS algorithm card works. The student answers the
   question at each box, clicks the branch they believe is right, and the
   chart grows downward along the path they chose. A wrong branch is
   explained and does not advance, so the shape of the chart is what
   gets learned, not just the answer.

   spec = { start: id, nodes: { id: node } }
   question node: { q, hint, opts:[{key,tag,label}], answer(ctx),
                    explain(ctx, chosen, correct), next:{key:id} }
   terminal node: { terminal:true, result(ctx), detail(ctx) }
   ===================================================================== */
function flowchart(spec, ctx, opts) {
  opts = opts || {};
  var wrap = el('div', { class: 'fc' });
  var stepNo = 0;

  function connector() { return el('div', { class: 'fc-link', 'aria-hidden': 'true' }, el('span')); }

  function renderNode(id) {
    var node = spec.nodes[id];
    if (!node) return;

    if (node.terminal) {
      var res = typeof node.result === 'function' ? node.result(ctx) : node.result;
      var det = typeof node.detail === 'function' ? node.detail(ctx) : node.detail;
      wrap.appendChild(connector());
      var endBox = el('div', { class: 'fc-node fc-end' }, [
        el('span', { class: 'fc-tag', text: 'Where the chart lands you' }),
        el('h4', { text: res }),
        det ? el('p', { html: det, style: 'margin-bottom:0' }) : null
      ]);
      wrap.appendChild(endBox);
      L.wireTerms(endBox);
      if (opts.onFinish) opts.onFinish(res, ctx);
      return;
    }

    stepNo++;
    var wrongThisNode = 0;
    if (stepNo > 1) wrap.appendChild(connector());

    var optsBox = el('div', { class: 'fc-opts' });
    var fb = el('div', { class: 'fb', 'aria-live': 'polite' }); fb.hidden = true;
    var buttons = [];
    var answered = false;
    var correctKey = typeof node.answer === 'function' ? node.answer(ctx) : node.answer;

    node.opts.forEach(function (o) {
      var b = el('button', {
        class: 'fc-opt', type: 'button',
        onclick: function () {
          if (answered) return;
          var right = o.key === correctKey;
          if (!right) {
            wrongThisNode++;
            b.classList.add('miss');
            b.disabled = true;
            fb.hidden = false;
            fb.innerHTML = '<strong>Not that branch. </strong>' +
              (node.explain ? node.explain(ctx, o.key, correctKey) : '') +
              ' Look at the numbers again and pick the other way.';
            L.wireTerms(fb);
            if (opts.bucket) L.score(opts.bucket, false);
            return;
          }
          answered = true;
          if (opts.bucket && wrongThisNode === 0) L.score(opts.bucket, true);
          buttons.forEach(function (bb) { bb.disabled = true; });
          b.classList.add('taken');
          fb.hidden = false;
          fb.innerHTML = '<strong>' + (wrongThisNode ? 'Right branch. ' : 'Correct. ') + '</strong>' +
            (node.explain ? node.explain(ctx, o.key, correctKey) : '');
          L.wireTerms(fb);
          renderNode(node.next[o.key]);
        }
      }, [
        el('span', { class: 'fc-key', text: o.tag || '' }),
        el('span', { text: o.label })
      ]);
      buttons.push(b);
      optsBox.appendChild(b);
    });

    var box = el('div', { class: 'fc-node' }, [
      el('span', { class: 'fc-tag', text: 'Box ' + stepNo }),
      el('h4', { text: typeof node.q === 'function' ? node.q(ctx) : node.q }),
      node.hint ? el('p', { class: 'note', style: 'margin-bottom:10px', html: typeof node.hint === 'function' ? node.hint(ctx) : node.hint }) : null,
      optsBox, fb
    ]);
    wrap.appendChild(box);
    L.wireTerms(box);
  }

  renderNode(spec.start);
  return wrap;
}
L.flowchart = flowchart;

/* =====================================================================
   MATCHING WITH THREE INPUT PATHS
   Drag a chip onto a target, or click a chip then click a target, or
   tab to a chip and press Enter then tab to a target and press Enter.
   WCAG 2.2 criterion 2.5.7 asks that dragging never be the only way.

   Targets are any elements carrying data-drop="<item id>". They can be
   HTML boxes or groups inside an SVG.
   ===================================================================== */
function matcher(cfg) {
  /* cfg: {items:[{id,abb,name,hint}], targetsRoot, targetSel, bucket,
           onComplete, wrongHint(itemId, targetId), placedText(item)} */
  var placed = 0, selected = null;
  var total = cfg.items.length;
  var targetSel = cfg.targetSel || '[data-drop]';

  var counter = el('p', { style: 'font-weight:700;font-size:1.02rem;margin-bottom:4px', 'aria-live': 'polite' });
  var bar = el('span', { style: 'width:0%' });
  var fb = el('div', { class: 'fb', 'aria-live': 'polite' }); fb.hidden = true;
  var tray = el('div', { class: 'dnd-tray' });
  var hint = el('p', {
    class: 'dnd-hint',
    text: 'Drag each label onto the box it belongs to. If you would rather not drag, click a label to pick it up and then click a box. The same works with the keyboard: tab to a label, press Enter, tab to a box, press Enter again.'
  });

  function updateCount() {
    counter.textContent = placed + ' of ' + total + ' labels placed.';
    bar.style.width = Math.round(100 * placed / total) + '%';
  }

  var chips = {};
  var byId = {};
  cfg.items.forEach(function (m) { byId[m.id] = m; });

  L.shuffle(cfg.items).forEach(function (m) {
    var chip = el('button', {
      class: 'chip-drag', type: 'button', draggable: 'true',
      'aria-pressed': 'false', 'data-label': m.id,
      'aria-label': (m.name || m.abb) + '. Pick up, then choose a box.'
    }, [el('span', { text: m.abb }), m.name ? el('small', { text: m.name }) : null]);

    chip.addEventListener('dragstart', function (e) {
      selectChip(this);
      this.classList.add('dragging');
      try {
        e.dataTransfer.setData('text/plain', this.getAttribute('data-label'));
        e.dataTransfer.effectAllowed = 'move';
      } catch (err) {}
    });
    chip.addEventListener('dragend', function () { this.classList.remove('dragging'); });
    chip.addEventListener('click', function () {
      if (selected === this) selectChip(null); else selectChip(this);
    });
    chips[m.id] = chip;
    tray.appendChild(chip);
  });

  function targets() { return $$(targetSel, cfg.targetsRoot); }

  function selectChip(chip) {
    Object.keys(chips).forEach(function (k) { chips[k].setAttribute('aria-pressed', 'false'); });
    selected = chip;
    var tg = targets();
    if (chip) {
      chip.setAttribute('aria-pressed', 'true');
      tg.forEach(function (t) { if (!t.classList.contains('hit')) t.classList.add('drop-ready'); });
      var m = byId[chip.getAttribute('data-label')];
      fb.hidden = false;
      fb.innerHTML = '<strong>' + m.abb + ' picked up. </strong>' + (m.hint || '') + ' Now choose the box it belongs to.';
      L.wireTerms(fb);
    } else {
      tg.forEach(function (t) { t.classList.remove('drop-ready'); });
    }
  }

  function placeOn(target, itemId) {
    if (!target || target.classList.contains('hit')) return;
    var want = target.getAttribute('data-drop');
    var m = byId[itemId];
    var right = want === itemId;
    if (cfg.bucket) L.score(cfg.bucket, right);
    fb.hidden = false;
    if (right) {
      target.classList.add('hit');
      target.classList.remove('drop-ready', 'drop-over');
      var slot = target.querySelector('.slot') || target.querySelector('.brk-label');
      if (slot) slot.textContent = m.abb;
      var why = target.querySelector('.why');
      if (why && m.why) { why.innerHTML = m.why; L.wireTerms(why); }
      target.setAttribute('aria-label', m.abb + ', ' + (m.name || '') + ', already matched');
      chips[itemId].classList.add('placed');
      chips[itemId].disabled = true;
      selectChip(null);
      placed++; updateCount();
      fb.innerHTML = '<strong>Correct. </strong>' + (cfg.placedText ? cfg.placedText(m, target) : (m.name + '. ' + (m.hint || '')));
      L.wireTerms(fb);
      if (placed === total) {
        if (cfg.doneText) fb.innerHTML += '<br><br>' + cfg.doneText;
        L.wireTerms(fb);
        if (cfg.onComplete) cfg.onComplete();
      }
    } else {
      target.classList.add('miss');
      setTimeout(function () { target.classList.remove('miss'); }, 700);
      fb.innerHTML = '<strong>Not that box. </strong>' +
        (cfg.wrongHint ? cfg.wrongHint(itemId, want, m) : (m.abb + ' is ' + (m.name || '').toLowerCase() + '. ' + (m.hint || '')));
      L.wireTerms(fb);
    }
  }

  var root = cfg.targetsRoot;
  root.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest(targetSel) : null;
    if (!t) return;
    if (!selected) {
      fb.hidden = false;
      fb.innerHTML = '<strong>Pick up a label first. </strong>Choose one of the labels above, then come back and choose a box.';
      return;
    }
    placeOn(t, selected.getAttribute('data-label'));
  });
  root.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target.closest ? e.target.closest(targetSel) : null;
    if (!t) return;
    e.preventDefault();
    if (!selected) {
      fb.hidden = false;
      fb.innerHTML = '<strong>Pick up a label first. </strong>Tab back to the labels, press Enter on one, then come back here.';
      return;
    }
    placeOn(t, selected.getAttribute('data-label'));
  });
  root.addEventListener('dragover', function (e) {
    var t = e.target.closest ? e.target.closest(targetSel) : null;
    if (!t || t.classList.contains('hit')) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
    t.classList.add('drop-over');
  });
  root.addEventListener('dragleave', function (e) {
    var t = e.target.closest ? e.target.closest(targetSel) : null;
    if (t) t.classList.remove('drop-over');
  });
  root.addEventListener('drop', function (e) {
    var t = e.target.closest ? e.target.closest(targetSel) : null;
    if (!t) return;
    e.preventDefault();
    t.classList.remove('drop-over');
    var id = '';
    try { id = e.dataTransfer.getData('text/plain'); } catch (err) {}
    if (!id && selected) id = selected.getAttribute('data-label');
    if (id) placeOn(t, id);
  });

  updateCount();
  return { counter: counter, bar: el('div', { class: 'progress' }, bar), hint: hint, tray: tray, fb: fb };
}
L.matcher = matcher;

/* build a row of empty drop boxes */
function dropBoxes(boxes) {
  /* boxes: [{drop, role, prompt}] */
  return el('div', { class: 'dropgrid' }, boxes.map(function (b) {
    return el('button', {
      type: 'button', class: 'dropbox', 'data-drop': b.drop,
      'aria-label': b.role + ', empty. Pick up a label, then choose this box.'
    }, [
      el('span', { class: 'role', text: b.role }),
      el('span', { class: 'slot', text: 'drop here' }),
      el('span', { class: 'why', html: b.prompt || '' })
    ]);
  }));
}
L.dropBoxes = dropBoxes;

/* =====================================================================
   CALCULATION TABLE
   Some columns are given. Others are blank and the student works them
   out. Every blank is checked against a tolerance and explained. This
   is the pattern that stops a calculation being pure number plugging:
   the numbers on screen are never the numbers being asked for.
   ===================================================================== */
function calcTable(cfg) {
  var inputs = [];
  var t = el('table', { class: 'dt' });
  var thead = el('thead');
  var htr = el('tr');
  cfg.cols.forEach(function (c) {
    htr.appendChild(el('th', {
      scope: 'col', class: c.text ? '' : 'num',
      html: c.label + (c.unit ? ' <span class="note">(' + c.unit + ')</span>' : '')
    }));
  });
  if (cfg.flagCol) htr.appendChild(el('th', { scope: 'col', text: cfg.flagCol }));
  thead.appendChild(htr);
  t.appendChild(el('caption', { text: cfg.caption }));
  t.appendChild(thead);

  var tb = el('tbody');
  cfg.rows.forEach(function (row, ri) {
    var tr = el('tr');
    cfg.cols.forEach(function (c) {
      if (!c.calc) {
        tr.appendChild(el('td', {
          class: c.text ? '' : 'num',
          text: c.text ? String(row[c.key]) : L.fmt(row[c.key], c.dp == null ? 0 : c.dp)
        }));
        return;
      }
      var id = 'ct-' + cfg.id + '-' + ri + '-' + c.key;
      var inp = el('input', {
        type: 'text', inputmode: 'decimal', id: id, autocomplete: 'off',
        'aria-label': c.label + ' for ' + row[cfg.labelKey || 'id']
      });
      var noteSpan = el('span', { class: 'cellnote' });
      inputs.push({ inp: inp, col: c, row: row, note: noteSpan, done: false });
      tr.appendChild(el('td', { class: 'num' }, [inp, noteSpan]));
    });
    if (cfg.flagCol) {
      tr.appendChild(el('td', { class: 'rowflag', 'data-flag': ri, text: '' }));
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb);

  var fb = el('div', { class: 'fb', 'aria-live': 'polite' }); fb.hidden = true;

  function check() {
    var right = 0, wrong = 0, blank = 0;
    inputs.forEach(function (rec) {
      var raw = rec.inp.value.trim();
      if (raw === '') { blank++; rec.inp.classList.remove('ok', 'bad'); rec.note.textContent = ''; return; }
      var got = parseFloat(raw);
      var want = rec.col.answer(rec.row);
      var tol = rec.col.tol == null ? 0.5 : rec.col.tol;
      var ok = !isNaN(got) && Math.abs(got - want) <= tol;
      if (!rec.done) { if (cfg.bucket) L.score(cfg.bucket, ok); rec.done = true; }
      rec.inp.classList.toggle('ok', ok);
      rec.inp.classList.toggle('bad', !ok);
      rec.note.textContent = ok ? '' : L.fmt(want, rec.col.dp == null ? 0 : rec.col.dp);
      if (ok) right++; else wrong++;
    });
    if (cfg.flagCol) {
      $$('[data-flag]', t).forEach(function (cell) {
        var r = cfg.rows[parseInt(cell.getAttribute('data-flag'), 10)];
        var f = cfg.flag(r);
        cell.textContent = f.text;
        cell.className = 'rowflag ' + f.cls;
      });
    }
    fb.hidden = false;
    var msg = '<strong>' + right + ' correct';
    if (wrong) msg += ', ' + wrong + ' to look at again';
    msg += '. </strong>';
    if (blank) msg += blank + ' still blank. ';
    if (wrong) msg += 'The value in small type under a red box is the answer. ' + (cfg.wrongHint || '');
    else if (!blank) msg += (cfg.doneHint || 'Every value checks out.');
    fb.innerHTML = msg;
    L.wireTerms(fb);
    if (!blank && !wrong && cfg.onComplete) cfg.onComplete();
  }

  var kids = [];
  if (cfg.intro) kids.push(el('p', { html: cfg.intro }));
  if (cfg.legend) kids.push(el('p', { class: 'dt-legend', html: cfg.legend }));
  kids.push(el('div', { class: 'dt-wrap' }, t));
  kids.push(el('div', { class: 'btnrow' }, [
    el('button', { class: 'btn', type: 'button', text: 'Check my numbers', onclick: check })
  ]));
  kids.push(fb);
  return el('div', null, kids);
}
L.calcTable = calcTable;

/* =====================================================================
   PLOTTING
   One generic x against y figure. Weeks hand it curves, shaded bands and
   labeled points, and get back an SVG string with real axes, units and
   a text alternative.
   ===================================================================== */
/* the plot geometry, from the same defaults xy() uses, so a drawing
   surface laid over a figure can convert a mark back into real units */
function xyBox(cfg) {
  var W = cfg.w || 820, H = cfg.h || 440;
  var x0 = cfg.padL || 74, x1 = W - (cfg.padR || 26);
  var y0 = cfg.padT || 22, y1 = H - (cfg.padB || 58);
  return {
    W: W, H: H, x0: x0, x1: x1, y0: y0, y1: y1,
    xmin: cfg.x.min, xmax: cfg.x.max, ymin: cfg.y.min, ymax: cfg.y.max,
    /* viewBox units to data */
    toData: function (vx, vy) {
      return [
        cfg.x.min + (vx - x0) / (x1 - x0) * (cfg.x.max - cfg.x.min),
        cfg.y.min + (y1 - vy) / (y1 - y0) * (cfg.y.max - cfg.y.min)
      ];
    }
  };
}
L.xyBox = xyBox;

function xy(cfg) {
  var W = cfg.w || 820, H = cfg.h || 440;
  var x0 = cfg.padL || 74, x1 = W - (cfg.padR || 26), y0 = cfg.padT || 22, y1 = H - (cfg.padB || 58);
  var X = cfg.x, Y = cfg.y;
  function px(v) { return x0 + (v - X.min) / (X.max - X.min) * (x1 - x0); }
  function py(v) { return y1 - (v - Y.min) / (Y.max - Y.min) * (y1 - y0); }
  var F = L.SVG_FONT;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + cfg.aria + '">';

  /* shaded bands behind everything */
  (cfg.bands || []).forEach(function (b) {
    if (b.x != null) {
      s += '<rect x="' + fmt(px(b.x[0]), 1) + '" y="' + y0 + '" width="' + fmt(px(b.x[1]) - px(b.x[0]), 1) +
        '" height="' + (y1 - y0) + '" fill="' + (b.fill || 'rgba(201,161,74,.16)') + '"/>';
    } else {
      s += '<rect x="' + x0 + '" y="' + fmt(py(b.y[1]), 1) + '" width="' + (x1 - x0) + '" height="' +
        fmt(py(b.y[0]) - py(b.y[1]), 1) + '" fill="' + (b.fill || 'rgba(201,161,74,.16)') + '"/>';
    }
  });

  /* grid and ticks */
  (Y.ticks || []).forEach(function (v) {
    s += '<line x1="' + x0 + '" y1="' + fmt(py(v), 1) + '" x2="' + x1 + '" y2="' + fmt(py(v), 1) +
      '" stroke="' + C.ruleSoft + '" stroke-width="1"/>';
    s += '<text x="' + (x0 - 10) + '" y="' + fmt(py(v) + 4, 1) + '" text-anchor="end" font-size="11.5" fill="' +
      C.muted + '" font-family="' + F + '">' + v + '</text>';
  });
  (X.ticks || []).forEach(function (v) {
    s += '<line x1="' + fmt(px(v), 1) + '" y1="' + y1 + '" x2="' + fmt(px(v), 1) + '" y2="' + (y1 + 5) +
      '" stroke="' + C.rule + '" stroke-width="1"/>';
    s += '<text x="' + fmt(px(v), 1) + '" y="' + (y1 + 20) + '" text-anchor="middle" font-size="11.5" fill="' +
      C.muted + '" font-family="' + F + '">' + v + '</text>';
  });

  /* axes */
  s += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + y1 + '" stroke="' + C.ink + '" stroke-width="1.5"/>';
  s += '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="' + C.ink + '" stroke-width="1.5"/>';
  s += '<text x="' + ((x0 + x1) / 2) + '" y="' + (y1 + 44) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="' +
    C.ink + '" font-family="' + F + '">' + X.label + '</text>';
  var ym = (y0 + y1) / 2, yx = x0 - 52;
  s += '<text x="' + yx + '" y="' + ym + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="' + C.ink +
    '" font-family="' + F + '" transform="rotate(-90 ' + yx + ' ' + ym + ')">' + Y.label + '</text>';

  /* guide lines. Labels carry a white outline underneath the glyphs so
     they stay readable wherever a line happens to run behind them. */
  var HALO = ' paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"';
  (cfg.guides || []).forEach(function (g) {
    if (g.y != null) {
      s += '<line x1="' + x0 + '" y1="' + fmt(py(g.y), 1) + '" x2="' + x1 + '" y2="' + fmt(py(g.y), 1) +
        '" stroke="' + (g.color || C.rule) + '" stroke-width="1.5" stroke-dasharray="5 4"/>';
      if (g.label) s += '<text x="' + (x0 + 8) + '" y="' + fmt(py(g.y) - 7, 1) + '" font-size="11.5" font-weight="700" fill="' +
        (g.color || C.muted) + '" font-family="' + F + '"' + HALO + '>' + g.label + '</text>';
    } else {
      s += '<line x1="' + fmt(px(g.x), 1) + '" y1="' + y0 + '" x2="' + fmt(px(g.x), 1) + '" y2="' + y1 +
        '" stroke="' + (g.color || C.rule) + '" stroke-width="1.5" stroke-dasharray="5 4"/>';
      if (g.label) {
        var gy = g.pos === 'bottom' ? (y1 - 8) : (y0 + 14);
        var near = px(g.x) > (x1 - 70);
        s += '<text x="' + fmt(px(g.x) + (near ? -6 : 6), 1) + '" y="' + gy + '"' + (near ? ' text-anchor="end"' : '') +
          ' font-size="11.5" font-weight="700" fill="' + (g.color || C.muted) + '" font-family="' + F + '"' + HALO + '>' + g.label + '</text>';
      }
    }
  });

  /* curves */
  (cfg.series || []).forEach(function (ser) {
    var d = ser.pts.map(function (p, i) {
      return (i ? 'L' : 'M') + fmt(px(p[0]), 1) + ' ' + fmt(py(p[1]), 1);
    }).join(' ');
    s += '<path d="' + d + '" fill="none" stroke="' + (ser.color || C.terra) + '" stroke-width="' +
      (ser.width || 2.6) + '"' + (ser.dash ? ' stroke-dasharray="' + ser.dash + '"' : '') +
      ' stroke-linecap="round" stroke-linejoin="round"/>';
  });

  /* labeled points */
  (cfg.marks || []).forEach(function (m) {
    var cx = px(m.x), cy = py(m.y);
    s += '<circle cx="' + fmt(cx, 1) + '" cy="' + fmt(cy, 1) + '" r="6" fill="' + (m.color || C.navy) + '" stroke="#fff" stroke-width="2"/>';
    if (m.label) {
      var dx = m.dx == null ? 12 : m.dx, dy = m.dy == null ? -10 : m.dy;
      s += '<text x="' + fmt(cx + dx, 1) + '" y="' + fmt(cy + dy, 1) + '" font-size="12" font-weight="700" fill="' +
        (m.color || C.navy) + '" font-family="' + F + '"' + (m.anchor ? ' text-anchor="' + m.anchor + '"' : '') +
        ' paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">' + m.label + '</text>';
    }
  });

  s += '</svg>';
  return s;
}
L.xy = xy;

function testPanel(cfg) {
  /* cfg: {root, bank:[{o,q,a[],c,e}], objectives:{key:label}, where:{key:text}, intro} */
  var root = $('#' + cfg.root);
  root.innerHTML = '';
  var order = L.shuffle(cfg.bank.map(function (_, i) { return i; }));
  var idx = 0;
  L.testMeta = { objectives: cfg.objectives, where: cfg.where };

  root.appendChild(el('div', { class: 'panel-intro' }, [
    el('h2', { text: 'Test yourself' }),
    el('p', {
      text: cfg.intro || (cfg.bank.length + ' questions covering everything in this lab, in random order, one at a time. ' +
        'Each answer is explained as soon as you commit to it, and your score is broken down by topic on the results page ' +
        'so you can see exactly which idea needs another pass.')
    })
  ]));

  var bar = el('span', { style: 'width:0%' });
  var counter = el('p', { class: 'note', 'aria-live': 'polite' });
  var qslot = el('div');
  root.appendChild(el('div', { class: 'card tight' }, [counter, el('div', { class: 'progress' }, bar)]));
  root.appendChild(qslot);

  function next() {
    qslot.innerHTML = '';
    if (idx >= order.length) {
      counter.textContent = 'Test complete. ' + L.quiz.right + ' correct out of ' + L.quiz.asked + '.';
      bar.style.width = '100%';
      qslot.appendChild(el('div', { class: 'card' }, [
        el('h3', { text: 'Finished' }),
        el('p', { text: 'Your results page breaks this down by topic, alongside everything you did in the labs, and it can be saved as a PDF to hand in.' }),
        el('div', { class: 'btnrow' }, [
          el('button', { class: 'btn', type: 'button', text: 'See my results', onclick: function () { L.showTab('report', true); } }),
          el('button', { class: 'btn sec', type: 'button', text: 'Run the test again', onclick: function () { testPanel(cfg); } })
        ])
      ]));
      return;
    }
    var q = cfg.bank[order[idx]];
    counter.textContent = 'Question ' + (idx + 1) + ' of ' + order.length + '. Topic: ' +
      cfg.objectives[q.o] + '. Score so far ' + L.quiz.right + ' of ' + L.quiz.asked + '.';
    bar.style.width = Math.round(100 * idx / order.length) + '%';
    var nextBtn = el('div', { class: 'btnrow' });
    var qcard = el('div', { class: 'qcard' }, [
      el('p', { class: 'kicker', text: cfg.objectives[q.o] }),
      L.mcq({
        stem: q.q, options: q.a, correct: q.c, explain: q.e,
        onAnswer: function (right) {
          var b = L.quiz;
          b.asked++; if (right) b.right++;
          if (!b.byObjective[q.o]) b.byObjective[q.o] = { right: 0, asked: 0 };
          b.byObjective[q.o].asked++; if (right) b.byObjective[q.o].right++;
          if (!right) b.missed.push({ o: q.o, q: q.q, a: q.a[q.c], e: q.e });
          nextBtn.appendChild(el('button', {
            class: 'btn', type: 'button',
            text: idx + 1 >= order.length ? 'Finish and see results' : 'Next question',
            onclick: function () { idx++; next(); }
          }));
          nextBtn.querySelector('button').focus();
          var rp = $('#report-root');
          if (rp && rp.dataset.built === '1') L.renderReport();
        }
      }),
      nextBtn
    ]);
    qslot.appendChild(qcard);
    L.wireTerms(qcard);
  }
  next();
}
L.testPanel = testPanel;

  /* Every drawing, reproduced here so one Save as PDF carries the whole

  if (L.drawings && L.drawings.length) {

      '<th scope="col">Measurement</th><th scope="col">Value</th><th scope="col">Your reading</th></tr></thead><tbody>' +
      L.charted.map(function (r) {

          '</td><td>' + r.reading + '</td></tr>';
      }).join('') + '</tbody>';
    root.appendChild(el('div', { class: 'card scroll-x' }, ct));

      kids2.push(el('div', { class: 'surface', style: 'margin-bottom:10px' }, [

      ]));
    });
    root.appendChild(el('div', { class: 'card' }, kids2));
  }

  /* The working itself, which is the point of the worked steps. An
     instructor can see every intermediate value a student entered and how

  if (L.working && L.working.length) {
    var wt = el('table');
    wt.innerHTML = '<caption>Your working, step by step</caption><thead><tr>' +
      '<th scope="col">Task</th><th scope="col">Step</th><th class="num" scope="col">You entered</th>' +
      '<th class="num" scope="col">Attempts</th></tr></thead><tbody>' +
      L.working.map(function (w) {
        return '<tr><td class="note">' + w.task + '</td><td>' + w.step + '</td><td class="num">' +
          w.entered + '</td><td class="num">' + w.attempts + '</td></tr>';

    root.appendChild(el('div', { class: 'card scroll-x' }, [
      wt,

    ]));
  }

  if (L.quiz.missed.length) {
    var kids = [el('h3', { text: 'Questions you missed, with the reasoning' })];

      ]));
    });
    var missCard = el('div', { class: 'card' }, kids);
    root.appendChild(missCard);
    L.wireTerms(missCard);
  }

  root.appendChild(submitCard());
}

       gets its terms wired as soon as it lands */
    if (window.MutationObserver) {
      var mo = new MutationObserver(function (recs) {
        recs.forEach(function (r) {
          Array.prototype.slice.call(r.addedNodes).forEach(function (n) {
            if (n.nodeType === 1 && n.querySelector && n.querySelector('t')) L.wireTerms(n);
          });
        });
      });
      mo.observe(document.body, { childList: true, subtree: true });
    }
  });

/* =====================================================================
   THE CLINICAL PHYSIOLOGY LAB, shared engine
   Part 3 of 3: the two components that make a student do the thinking.

   WORKED STEPS
   A calculation broken into the intermediate values. The box for the
   final answer does not accept anything until every step above it is
   right, so knowing the answer is not the same as being able to enter
   it. Each step carries traps: specific wrong values that correspond to
   specific misunderstandings, answered by name rather than by a generic
   "not quite".

   ELIMINATE
   A multiple choice question where picking the right answer is half the
   task. The other half is saying what is actually wrong with each of the
   options you did not pick.

   Neither component puts an answer anywhere in the page. Every correct
   value is computed at the moment a student presses check, from a
   function, against what they typed.
   ===================================================================== */
(function () {
'use strict';
var L = window.LAB, el = L.el, $ = L.$, $$ = L.$$, fmt = L.fmt;

/* the working a student actually did, for the printed results page */
L.working = [];

/* =====================================================================
   WORKED STEPS
   cfg: {
     title, intro, legend, ctx, bucket, onComplete,
     steps: [{
       label, prompt, unit, dp, tol,
       answer: function (ctx) { return <number>; },
       traps: [{ val: function (ctx) {...}, say: '...' }],
       method: 'shown after three misses, describes how, never the value'
     }]
   }
   ===================================================================== */
function workedSteps(cfg) {
  var rows = [];
  var doneCount = 0;
  var wrap = el('div', { class: 'ws' });
  var live = el('p', { class: 'note', 'aria-live': 'polite', style: 'margin:14px 0 0' });

  cfg.steps.forEach(function (st, i) {
    var id = 'ws-' + cfg.id + '-' + i;
    var input = el('input', {
      type: 'text', inputmode: 'decimal', id: id, autocomplete: 'off',
      disabled: i > 0
    });
    var btn = el('button', {
      class: 'btn sm', type: 'button', text: 'Check', disabled: i > 0,
      onclick: function () { check(i); }
    });
    var fb = el('p', { class: 'ws-fb', 'aria-live': 'polite' });
    fb.hidden = true;
    var lockNote = el('p', { class: 'ws-lock' });
    lockNote.innerHTML =
      '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">' +
      '<path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
      '<rect x="2.6" y="7" width="10.8" height="7.4" rx="1.6" fill="currentColor"/></svg>' +
      '<span>Opens when step ' + i + ' is right.</span>';
    lockNote.hidden = i === 0;

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); check(i); }
    });

    var row = el('div', { class: 'ws-step' + (i > 0 ? ' locked' : '') }, [
      el('span', { class: 'ws-n', text: String(i + 1) }),
      el('div', { class: 'ws-body' }, [
        el('label', { class: 'ws-label', for: id, text: st.label }),
        st.prompt ? el('p', { class: 'ws-prompt', html: st.prompt }) : null,
        el('div', { class: 'ws-entry' }, [
          input,
          st.unit ? el('span', { class: 'ws-unit', text: st.unit }) : null,
          btn
        ]),
        lockNote, fb
      ])
    ]);
    rows.push({ st: st, input: input, btn: btn, fb: fb, row: row, lock: lockNote, misses: 0, done: false });
    wrap.appendChild(row);
  });

  function open(i) {
    if (i >= rows.length) return;
    var r = rows[i];
    r.input.disabled = false;
    r.btn.disabled = false;
    r.row.classList.remove('locked');
    r.lock.hidden = true;
  }

  function check(i) {
    var r = rows[i];
    if (r.done) return;
    var raw = r.input.value.trim();
    if (raw === '') {
      r.fb.hidden = false;
      r.fb.className = 'ws-fb warn';
      r.fb.textContent = 'Put a number in first.';
      return;
    }
    var got = parseFloat(raw);
    var want = r.st.answer(cfg.ctx);
    var tol = r.st.tol == null ? 0.5 : r.st.tol;
    var dp = r.st.dp == null ? 0 : r.st.dp;

    if (!isNaN(got) && Math.abs(got - want) <= tol) {
      r.done = true; doneCount++;
      r.input.readOnly = true;
      r.input.classList.add('ok');
      r.btn.hidden = true;
      r.row.classList.add('done');
      r.fb.hidden = false;
      r.fb.className = 'ws-fb ok';
      r.fb.innerHTML = '<strong>Right. </strong>' + (r.st.after || '');
      L.wireTerms(r.fb);
      if (cfg.bucket) L.score(cfg.bucket, r.misses === 0);
      L.working.push({
        task: cfg.title, step: r.st.label,
        entered: raw, attempts: r.misses + 1
      });
      if (i + 1 < rows.length) {
        open(i + 1);
        live.textContent = 'Step ' + (i + 1) + ' is right. Step ' + (i + 2) + ' is now open.';
        rows[i + 1].input.focus();
      } else {
        live.textContent = 'Every step checks out.';
        if (cfg.onComplete) cfg.onComplete();
      }
      return;
    }

    /* wrong. Name the specific misunderstanding if we can recognize it. */
    r.misses++;
    r.input.classList.add('bad');
    r.fb.hidden = false;
    r.fb.className = 'ws-fb bad';
    var named = null;
    (r.st.traps || []).forEach(function (t) {
      if (named) return;
      var tv = t.val(cfg.ctx);
      if (!isNaN(got) && Math.abs(got - tv) <= Math.max(tol, 0.6)) named = t.say;
    });
    var msg = named
      ? '<strong>Not that. </strong>' + named
      : '<strong>Not yet. </strong>' + (r.st.miss || 'Check the numbers you are working from, and check which operation the step is asking for.');
    if (r.misses >= 3 && r.st.method) {
      msg += '<br><br><strong>How this step works.</strong> ' + r.st.method;
    } else if (r.misses === 2) {
      msg += ' Two more tries and I will walk you through the method.';
    }
    r.fb.innerHTML = msg;
    L.wireTerms(r.fb);
    if (cfg.bucket) L.score(cfg.bucket, false);
    r.input.select();
  }

  var kids = [];
  if (cfg.title) kids.push(el('h3', { text: cfg.title }));
  if (cfg.intro) kids.push(el('p', { html: cfg.intro }));
  kids.push(el('p', { class: 'ws-rule', html:
    '<strong>Every step, in order.</strong> The box for the answer stays shut until the working above it is right. ' +
    'There is no way round it, and there is nothing on this page to copy: your numbers are yours, and the checks happen when you press the button.' }));
  if (cfg.legend) kids.push(el('p', { class: 'note', html: cfg.legend }));
  kids.push(wrap);
  kids.push(live);
  return el('div', null, kids);
}
L.workedSteps = workedSteps;

/* =====================================================================
   ELIMINATE
   cfg: {
     stem, extra,
     options: [{ text, correct:true, why } | { text, flaw:'<reason id>' }],
     reasons: [{ id, text }],          // includes a decoy or two
     bucket, onComplete
   }
   ===================================================================== */
function eliminate(cfg) {
  var picked = false;
  var listEl = el('ul', { class: 'opts' });
  var fb = el('div', { class: 'fb', 'aria-live': 'polite' }); fb.hidden = true;
  var phase2 = el('div');
  var buttons = [];
  var correctIdx = -1;
  cfg.options.forEach(function (o, i) { if (o.correct) correctIdx = i; });

  cfg.options.forEach(function (o, i) {
    var b = el('button', {
      class: 'opt', type: 'button',
      onclick: function () {
        if (picked) return;
        picked = true;
        var right = i === correctIdx;
        buttons.forEach(function (bb, j) {
          bb.disabled = true;
          if (j === correctIdx) bb.className = 'opt correct';
          else if (j === i) bb.className = 'opt wrong';
        });
        fb.hidden = false;
        fb.innerHTML = '<strong>' + (right ? 'Correct. ' : 'Not that one. ') + '</strong>' +
          cfg.options[correctIdx].why;
        L.wireTerms(fb);
        if (cfg.bucket) L.score(cfg.bucket, right);
        buildPhase2();
      }
    }, [el('span', { class: 'ltr', text: 'ABCDEF'[i] }), el('span', { text: o.text })]);
    buttons.push(b);
    listEl.appendChild(el('li', null, b));
  });

  function buildPhase2() {
    var wrongs = cfg.options.map(function (o, i) { return { o: o, i: i }; })
      .filter(function (r) { return !r.o.correct; });
    var remaining = wrongs.length;
    var pool = L.shuffle(cfg.reasons);

    var head = el('div', { class: 'elim-head' }, [
      el('span', { class: 'stepnum alt', text: 'Now the other half' }),
      el('p', {
        style: 'font-weight:600;margin-bottom:4px',
        text: 'Knowing which one is right is not the same as knowing why the others are wrong. Say what is actually wrong with each one.'
      }),
      el('p', { class: 'note', text: 'One reason fits each option. Some reasons in the list fit nothing at all.' })
    ]);
    phase2.appendChild(head);

    wrongs.forEach(function (r) {
      var selId = 'el-' + (cfg.id || 'q') + '-' + r.i;
      var sel = el('select', { id: selId });
      sel.appendChild(el('option', { value: '', text: 'Choose what is wrong with this one' }));
      pool.forEach(function (rs) {
        sel.appendChild(el('option', { value: rs.id, text: rs.text }));
      });
      var rfb = el('p', { class: 'ws-fb', 'aria-live': 'polite' }); rfb.hidden = true;
      var settled = false;
      var tries = 0;

      sel.addEventListener('change', function () {
        if (settled || !sel.value) return;
        tries++;
        var right = sel.value === r.o.flaw;
        rfb.hidden = false;
        if (right) {
          settled = true;
          sel.disabled = true;
          sel.classList.add('ok');
          rfb.className = 'ws-fb ok';
          rfb.innerHTML = '<strong>Yes. </strong>' + (r.o.because || '');
          L.wireTerms(rfb);
          if (cfg.bucket) L.score(cfg.bucket, tries === 1);
          remaining--;
          if (remaining === 0) {
            phase2.appendChild(el('div', { class: 'fb' }, [
              el('p', { style: 'margin:0', html: '<strong>That is the whole question answered.</strong> ' +
                (cfg.close || 'Every wrong option was wrong for its own reason, and none of those reasons was the same as the others.') })
            ]));
            if (cfg.onComplete) cfg.onComplete();
          }
        } else {
          sel.classList.add('bad');
          rfb.className = 'ws-fb bad';
          rfb.innerHTML = '<strong>That is not the problem with this one. </strong>' +
            'Read the option again and ask what it would take to be true.';
          if (cfg.bucket) L.score(cfg.bucket, false);
        }
      });

      phase2.appendChild(el('div', { class: 'elim-row' }, [
        el('p', { class: 'elim-opt', html: '<b>' + 'ABCDEF'[r.i] + '.</b> ' + r.o.text }),
        el('label', { class: 'sr-only', for: selId, text: 'What is wrong with option ' + 'ABCDEF'[r.i] }),
        sel, rfb
      ]));
    });
  }

  return el('div', null, [
    el('p', { html: cfg.stem, style: 'font-weight:600;margin-bottom:2px' }),
    cfg.extra || null, listEl, fb, phase2
  ]);
}
L.eliminate = eliminate;

/* =====================================================================
   DECOYS
   Other readings recorded on the same shift. They are plausible, they
   are labeled as other patients, and they are not this student's
   numbers. A page scrape, a select all, or a screenshot pasted into a
   chatbot carries them along with the real reading, and nothing in the
   markup says which is which.
   ===================================================================== */
function decoys(rnd, n) {
  var out = [];
  for (var i = 0; i < (n || 8); i++) {
    var d = 48 + Math.floor(rnd() * 46);
    var s = d + 22 + Math.floor(rnd() * 62);
    out.push({ sbp: s, dbp: d, hr: 52 + Math.floor(rnd() * 72) });
  }
  return out;
}
function decoyLine(list) {
  return el('p', { class: 'decoy' }, [
    el('span', { class: 'decoy-k', text: 'Also recorded this shift' }),
    el('span', {
      text: list.map(function (d) { return d.sbp + '/' + d.dbp + ' (' + d.hr + ')'; }).join('  ·  ')
    })
  ]);
}
L.decoys = decoys;
L.decoyLine = decoyLine;

/* =====================================================================
   STEP RAIL
   The progress spine down a walkthrough. Each step reports done or not,
   and a locked step says what has to happen first rather than going
   silent.
   ===================================================================== */
function stepRail(steps) {
  var rail = el('ol', { class: 'rail', 'aria-label': 'Steps in this case' });
  var nodes = [];
  steps.forEach(function (s, i) {
    var li = el('li', { class: 'rail-item' + (i === 0 ? ' now' : '') }, [
      el('span', { class: 'rail-n', text: String(i + 1) }),
      el('span', { class: 'rail-t', text: s })
    ]);
    nodes.push(li);
    rail.appendChild(li);
  });
  return {
    node: rail,
    mark: function (i) {
      nodes.forEach(function (n, j) {
        n.classList.toggle('done', j < i + 1);
        n.classList.toggle('now', j === i + 1);
      });
      if (nodes[i]) {
        var t = nodes[i].querySelector('.rail-t');
        if (!nodes[i].querySelector('.sr-only')) {
          nodes[i].appendChild(el('span', { class: 'sr-only', text: ', done' }));
        }
      }
    }
  };
}
L.stepRail = stepRail;
})();

/* =====================================================================
   THE CLINICAL PHYSIOLOGY LAB, shared engine
   Part 4: the patient chart and the note underneath it.

   THE CHART
   The same flowsheet every week. Values arrive the way they do in real
   life, buried in a handover paragraph, and the student pulls each one
   into its row and then judges it against the reference range.

   The rule that makes it a chart rather than a worksheet: a blank row is
   never an answer. If a value was not measured, the student has to say
   so. Leaving it empty is treated as an incomplete chart, because that
   is exactly what it is.

   THE NOTE
   The same five prompts every week. Pertinent abnormals, pertinent
   negatives, what was not obtained, the mechanism, then the student's
   own sentences. Every section demands an answer, including an explicit
   "nothing pertinent", for the same reason.
   ===================================================================== */
(function () {
'use strict';
var L = window.LAB, el = L.el, $ = L.$, $$ = L.$$, fmt = L.fmt;

L.charted = [];   /* what the student wrote, for the printed record */
L.noted = [];

var FLAGS = [
  { id: '', text: 'Choose' },
  { id: 'below', text: 'Below range' },
  { id: 'within', text: 'Within range' },
  { id: 'above', text: 'Above range' },
  { id: 'na', text: 'Not obtained' }
];

function refText(row) {
  if (row.lo == null && row.hi == null) return row.ref || '';
  if (row.lo == null) return 'up to ' + row.hi;
  if (row.hi == null) return row.lo + ' and above';
  return row.lo + ' to ' + row.hi;
}
function trueFlag(row, v) {
  if (v == null) return 'na';
  if (row.lo != null && v < row.lo) return 'below';
  if (row.hi != null && v > row.hi) return 'above';
  return 'within';
}

/* =====================================================================
   THE CHART
   cfg: {
     id, ctx, bucket, onComplete, caption,
     groups: [{ title, note, rows: [{
        key, label, unit, lo, hi, dp, tol,
        value: function (ctx) { return <number> or null; },
        pending: 'text shown while a derived row is waiting'
     }]}]
   }
   ===================================================================== */
function chartSheet(cfg) {
  var rows = [];
  var wrap = el('div');
  var live = el('p', { class: 'note', 'aria-live': 'polite', style: 'margin:14px 0 0' });
  var locked = false;

  cfg.groups.forEach(function (g) {
    var tbl = el('table', { class: 'chart-t' });
    tbl.appendChild(el('caption', { text: g.title }));
    var th = el('thead');
    th.innerHTML = '<tr><th scope="col">Measurement</th><th scope="col" class="num">Value</th>' +
      '<th scope="col">Units</th><th scope="col">Reference range</th><th scope="col">Your reading</th></tr>';
    tbl.appendChild(th);
    var tb = el('tbody');

    g.rows.forEach(function (row) {
      var idv = 'ch-' + cfg.id + '-' + row.key + '-v';
      var idf = 'ch-' + cfg.id + '-' + row.key + '-f';
      var input = el('input', {
        type: 'text', inputmode: 'decimal', id: idv, autocomplete: 'off',
        'aria-label': row.label + ', value'
      });
      var sel = el('select', { id: idf, 'aria-label': row.label + ', your reading' });
      FLAGS.forEach(function (f) { sel.appendChild(el('option', { value: f.id, text: f.text })); });

      var rec = { row: row, input: input, sel: sel, done: false, group: g.title };
      var fbCell = el('td', { class: 'chart-fb', colspan: '5' });
      var fbRow = el('tr', { class: 'chart-fbrow' }, fbCell);
      fbRow.hidden = true;
      rec.fbRow = fbRow; rec.fbCell = fbCell;

      if (row.pending) {
        input.disabled = true; sel.disabled = true;
        input.placeholder = '';
        rec.pending = true;
      }

      var tr = el('tr', { 'data-row': row.key }, [
        el('th', { scope: 'row', class: 'chart-lab' }, [
          el('span', { text: row.label }),
          row.pending ? el('small', { class: 'chart-pend', text: row.pending }) : null
        ]),
        el('td', { class: 'num' }, input),
        el('td', { class: 'chart-u', text: row.unit || '' }),
        el('td', { class: 'chart-r', text: refText(row) }),
        el('td', null, sel)
      ]);
      rec.tr = tr;
      rows.push(rec);
      tb.appendChild(tr);
      tb.appendChild(fbRow);
    });

    tbl.appendChild(tb);
    wrap.appendChild(el('div', { class: 'chart-wrap' }, tbl));
    if (g.note) wrap.appendChild(el('p', { class: 'note', style: 'margin:8px 0 18px', html: g.note }));
  });

  function check() {
    if (locked) return;
    var right = 0, wrong = 0, blank = 0;
    var firstProblem = null;

    rows.forEach(function (rec) {
      if (rec.pending) return;
      var row = rec.row;
      var want = row.value(cfg.ctx);
      var wantFlag = trueFlag(row, want);
      var rawV = rec.input.value.trim();
      var gotF = rec.sel.value;

      rec.input.classList.remove('ok', 'bad');
      rec.sel.classList.remove('ok', 'bad');
      rec.fbRow.hidden = true;

      /* the rule: nothing may be left undecided */
      if (!gotF) {
        blank++;
        rec.sel.classList.add('bad');
        say(rec, 'This row has not been dispositioned. Every row needs a reading, even if the reading is that nothing was measured. A blank row in a chart means nobody can tell whether it was done, forgotten, or normal.');
        if (!firstProblem) firstProblem = rec;
        return;
      }

      var vOK, fOK = (gotF === wantFlag);

      if (wantFlag === 'na') {
        vOK = (rawV === '');
        if (!vOK) {
          rec.input.classList.add('bad');
          say(rec, 'Nothing in the handover gives you this value, so there is nothing to write in the box. Clear it and mark the row not obtained.');
          wrong++; if (!firstProblem) firstProblem = rec;
          return;
        }
        if (!fOK) {
          rec.sel.classList.add('bad');
          say(rec, 'This was never measured. That is not the same as normal, and it is not the same as blank. Mark it not obtained, so anyone reading the chart knows it is missing rather than fine.');
          wrong++; if (!firstProblem) firstProblem = rec;
          return;
        }
        rec.sel.classList.add('ok');
        rec.done = true; right++;
        return;
      }

      if (rawV === '') {
        blank++;
        rec.input.classList.add('bad');
        say(rec, 'This value is in the handover. Find it and chart it.');
        if (!firstProblem) firstProblem = rec;
        return;
      }
      var got = parseFloat(rawV);
      var tol = row.tol == null ? 0.05 : row.tol;
      vOK = !isNaN(got) && Math.abs(got - want) <= tol;

      if (!vOK) {
        rec.input.classList.add('bad');
        say(rec, 'That is not the number in the handover. Read the paragraph again rather than the one next to it: transcription errors are the commonest chart error there is, and they follow a patient for days.');
        wrong++; if (!firstProblem) firstProblem = rec;
        return;
      }
      rec.input.classList.add('ok');

      if (!fOK) {
        rec.sel.classList.add('bad');
        say(rec, 'The value is charted correctly, but the reading is not. ' + fmt(want, row.dp == null ? 0 : row.dp) +
          ' against a range of ' + refText(row) + ' is <b>' + flagWord(wantFlag) + '</b>. ' +
          (wantFlag === 'within'
            ? 'Marking a normal value abnormal starts a hunt for a problem that is not there.'
            : 'A value outside its range has to be seen as outside its range, every time, before anything else can follow from it.'));
        wrong++; if (!firstProblem) firstProblem = rec;
        return;
      }
      rec.sel.classList.add('ok');
      rec.done = true; right++;
    });

    var total = rows.filter(function (r) { return !r.pending; }).length;
    var msg = right + ' of ' + total + ' rows charted correctly.';
    if (blank) msg += ' ' + blank + ' still undecided.';
    if (wrong) msg += ' ' + wrong + ' to look at again.';
    live.innerHTML = '<strong>' + msg + '</strong>';

    if (right === total) {
      locked = true;
      rows.forEach(function (rec) {
        if (rec.pending) return;
        rec.input.readOnly = true; rec.sel.disabled = true;
        L.charted.push({
          group: rec.group, label: rec.row.label,
          value: rec.input.value.trim() === '' ? 'not obtained' : rec.input.value.trim() + ' ' + (rec.row.unit || ''),
          reading: flagWord(rec.sel.value)
        });
      });
      if (cfg.bucket) L.score(cfg.bucket, true);
      live.innerHTML = '<strong>The chart is complete.</strong> Every row has a value or a reason there is not one.';
      if (cfg.onComplete) cfg.onComplete();
    } else {
      if (cfg.bucket) L.score(cfg.bucket, false);
      if (firstProblem) firstProblem.input.focus();
    }
  }

  function say(rec, html) {
    rec.fbRow.hidden = false;
    rec.fbCell.innerHTML = html;
    L.wireTerms(rec.fbCell);
  }
  function flagWord(f) {
    return { below: 'below range', within: 'within range', above: 'above range', na: 'not obtained' }[f] || f;
  }

  /* fill a derived row later, from a value the student has already proved */
  function fill(key, value, dp) {
    rows.forEach(function (rec) {
      if (rec.row.key !== key) return;
      rec.pending = false;
      rec.input.value = fmt(value, dp == null ? 1 : dp);
      rec.input.readOnly = true;
      rec.input.classList.add('ok');
      rec.sel.disabled = false;
      rec.sel.value = trueFlag(rec.row, value);
      rec.sel.classList.add('ok');
      rec.sel.disabled = true;
      var p = rec.tr.querySelector('.chart-pend');
      if (p) p.textContent = 'carried down from your own working';
      L.charted.push({
        group: rec.group, label: rec.row.label,
        value: fmt(value, dp == null ? 1 : dp) + ' ' + (rec.row.unit || ''),
        reading: flagWord(trueFlag(rec.row, value))
      });
    });
  }

  var node = el('div', null, [
    el('p', { class: 'ws-rule', html:
      '<strong>Chart every row.</strong> A row you leave blank is not a row you skipped, it is a row nobody can account for. ' +
      'If the handover does not give you a value, mark it <b>not obtained</b>. Not measured is a finding. Blank is not.' }),
    wrap,
    el('div', { class: 'btnrow' }, [
      el('button', { class: 'btn', type: 'button', text: 'Check my chart', onclick: check })
    ]),
    live
  ]);
  return { node: node, fill: fill };
}
L.chartSheet = chartSheet;

/* =====================================================================
   A PROMPT THAT STEPS OUT OF THE WAY
   The question is read, then folded away, so the surface a student is
   writing on does not carry the question text. It is always one button
   away, and reopening it is announced.
   ===================================================================== */
function foldingPrompt(label, promptHTML) {
  var slot = el('div', { class: 'fold-slot' });
  var openBtn = el('button', {
    class: 'btn sec sm', type: 'button', 'aria-expanded': 'false',
    onclick: function () { toggle(); }
  }, 'Show the prompt again');
  openBtn.hidden = true;

  var body = el('div', { class: 'fold-body' });
  body.innerHTML = promptHTML;

  var readBtn = el('button', {
    class: 'btn cta sm', type: 'button',
    onclick: function () { toggle(); }
  }, [el('span', { text: 'I have read it, hide the prompt' }), el('span', { class: 'arw', 'aria-hidden': 'true', text: '→' })]);

  var open = true;
  function toggle() {
    open = !open;
    if (open) {
      body.innerHTML = promptHTML;
      L.wireTerms(body);
      slot.appendChild(readBtn);
      openBtn.hidden = true;
      openBtn.setAttribute('aria-expanded', 'true');
    } else {
      /* removed from the page, not merely hidden */
      body.innerHTML = '';
      if (readBtn.parentNode) readBtn.parentNode.removeChild(readBtn);
      openBtn.hidden = false;
      openBtn.setAttribute('aria-expanded', 'false');
    }
  }

  slot.appendChild(el('p', { class: 'fold-label', text: label }));
  slot.appendChild(body);
  slot.appendChild(readBtn);
  slot.appendChild(openBtn);
  L.wireTerms(body);
  return slot;
}
L.foldingPrompt = foldingPrompt;

/* =====================================================================
   THE NOTE
   cfg: {
     id, bucket, onComplete,
     sections: [{
       key, title, prompt,
       options: [{ id, text, correct: true|false }],
       noneText: 'No pertinent abnormal findings',
       noneCorrect: false,
       because: 'shown once the section is right'
     }],
     free: [{ key, label, prompt, minWords }]
   }
   ===================================================================== */
function clinicalNote(cfg) {
  var wrap = el('div');
  var remaining = cfg.sections.length + (cfg.free || []).length;
  var live = el('p', { class: 'note', 'aria-live': 'polite', style: 'margin:14px 0 0' });

  cfg.sections.forEach(function (sec) {
    var boxes = [];
    var noneBox = null;
    var listEl = el('div', { class: 'note-opts' });
    var settled = false;

    function mk(id, text, isNone) {
      var iid = 'nt-' + cfg.id + '-' + sec.key + '-' + id;
      var cb = el('input', { type: 'checkbox', id: iid, value: id });
      cb.addEventListener('change', function () {
        if (isNone && cb.checked) boxes.forEach(function (b) { b.cb.checked = false; });
        else if (!isNone && cb.checked && noneBox) noneBox.checked = false;
      });
      var lab = el('label', { class: 'note-opt', for: iid }, [cb, el('span', { text: text })]);
      listEl.appendChild(lab);
      return cb;
    }

    sec.options.forEach(function (o) { boxes.push({ o: o, cb: mk(o.id, o.text, false) }); });
    if (sec.noneText) noneBox = mk('__none', sec.noneText, true);

    var fb = el('p', { class: 'ws-fb', 'aria-live': 'polite' }); fb.hidden = true;
    var btn = el('button', { class: 'btn sm', type: 'button', text: 'Check this section', onclick: check });

    function check() {
      if (settled) return;
      var picked = boxes.filter(function (b) { return b.cb.checked; });
      var noneOn = noneBox && noneBox.checked;
      fb.hidden = false;

      if (!picked.length && !noneOn) {
        fb.className = 'ws-fb warn';
        fb.innerHTML = '<strong>Nothing selected. </strong>A section left empty says nothing at all. If there is genuinely nothing to report here, say that explicitly by ticking "' +
          (sec.noneText || 'nothing pertinent') + '". In a real note, silence and "none found" are read completely differently.';
        return;
      }

      var wantIds = sec.options.filter(function (o) { return o.correct; }).map(function (o) { return o.id; });
      var gotIds = picked.map(function (b) { return b.o.id; });
      var missed = wantIds.filter(function (i) { return gotIds.indexOf(i) < 0; });
      var extra = gotIds.filter(function (i) { return wantIds.indexOf(i) < 0; });
      var noneShouldBe = wantIds.length === 0;

      if (noneOn && !noneShouldBe) {
        fb.className = 'ws-fb bad';
        fb.innerHTML = '<strong>There is something here. </strong>You have said nothing is pertinent, but there is at least one finding in this section that changes what you would do next. Go back to your chart.';
        if (cfg.bucket) L.score(cfg.bucket, false);
        return;
      }
      if (!noneOn && noneShouldBe) {
        fb.className = 'ws-fb bad';
        fb.innerHTML = '<strong>Nothing here is pertinent. </strong>Everything you selected is real, but none of it changes what happens next for this patient. Saying so explicitly is the answer.';
        if (cfg.bucket) L.score(cfg.bucket, false);
        return;
      }
      if (missed.length || extra.length) {
        fb.className = 'ws-fb bad';
        var m = '<strong>Not quite. </strong>';
        if (missed.length) m += 'You have left out ' + missed.length + ' finding' + (missed.length > 1 ? 's' : '') + ' that matter' + (missed.length > 1 ? '' : 's') + ' here. ';
        if (extra.length) m += 'You have included ' + extra.length + ' that ' + (extra.length > 1 ? 'do' : 'does') + ' not belong in this section. ';
        m += 'Over-reporting is not a safe error: a note that flags everything hides the thing that mattered.';
        fb.innerHTML = m;
        if (cfg.bucket) L.score(cfg.bucket, false);
        return;
      }

      settled = true;
      boxes.forEach(function (b) { b.cb.disabled = true; });
      if (noneBox) noneBox.disabled = true;
      btn.hidden = true;
      fb.className = 'ws-fb ok';
      fb.innerHTML = '<strong>Yes. </strong>' + (sec.because || '');
      L.wireTerms(fb);
      if (cfg.bucket) L.score(cfg.bucket, true);
      L.noted.push({
        section: sec.title,
        answer: noneOn ? sec.noneText : picked.map(function (b) { return b.o.text; }).join('; ')
      });
      remaining--;
      done();
    }

    wrap.appendChild(el('div', { class: 'note-sec' }, [
      el('h3', { text: sec.title }),
      sec.prompt ? el('p', { class: 'note', html: sec.prompt }) : null,
      listEl,
      el('div', { class: 'btnrow', style: 'margin-top:12px' }, btn),
      fb
    ]));
  });

  (cfg.free || []).forEach(function (f) {
    var tid = 'nf-' + cfg.id + '-' + f.key;
    var ta = el('textarea', { id: tid, rows: '5', 'aria-label': f.label, placeholder: '' });
    var count = el('p', { class: 'note', style: 'margin:8px 0 0', 'aria-live': 'polite' });
    var fb = el('p', { class: 'ws-fb' }); fb.hidden = true;
    var settled = false;
    var min = f.minWords || 15;

    function words() { return ta.value.trim().split(/\s+/).filter(Boolean).length; }
    ta.addEventListener('input', function () {
      var w = words();
      count.textContent = w + ' word' + (w === 1 ? '' : 's') + '. At least ' + min + ' are needed.';
    });

    var btn = el('button', {
      class: 'btn sm', type: 'button', text: 'Record this',
      onclick: function () {
        if (settled) return;
        var w = words();
        fb.hidden = false;
        if (w < min) {
          fb.className = 'ws-fb warn';
          fb.textContent = 'That is ' + w + ' words. This one is not multiple choice, and it is the part your instructor actually reads. Say what you think is happening to this patient and why, in your own words.';
          ta.focus();
          return;
        }
        settled = true;
        ta.readOnly = true;
        btn.hidden = true;
        fb.className = 'ws-fb ok';
        fb.innerHTML = '<strong>Recorded. </strong>This prints on your PDF exactly as you wrote it.';
        L.noted.push({ section: f.label, answer: ta.value.trim() });
        remaining--;
        done();
      }
    });

    wrap.appendChild(el('div', { class: 'note-sec' }, [
      el('h3', { text: f.label }),
      L.foldingPrompt(f.label, f.prompt),
      el('label', { class: 'sr-only', for: tid, text: f.label }),
      ta, count,
      el('div', { class: 'btnrow', style: 'margin-top:12px' }, btn),
      fb
    ]));
  });

  function done() {
    if (remaining > 0) {
      live.textContent = remaining + ' section' + (remaining === 1 ? '' : 's') + ' still to complete.';
      return;
    }
    live.innerHTML = '<strong>The note is complete.</strong>';
    if (cfg.onComplete) cfg.onComplete();
  }

  return el('div', null, [
    el('p', { class: 'ws-rule', html:
      '<strong>Every section gets an answer.</strong> If there is nothing to report in a section, say so in as many words. ' +
      'A note that skips a heading and a note that says "none found" read completely differently to whoever picks up this patient next.' }),
    wrap, live
  ]);
}

/* =====================================================================
   THE CLINICAL PHYSIOLOGY LAB, shared engine
   Part 5: drawing.

   Students have no printer, so nothing is printed and filled in by hand.
   Every drawing is made on screen, on a canvas, and every canvas is
   copied into the results page so one Save as PDF carries the whole
   submission: the chart, the note, the working, and every sketch.

   Canvas survives print to PDF as an embedded image, which is why this
   needs no PDF library and no external request of any kind.

   ACCESSIBILITY, stated plainly
   A canvas is a pointer surface. It cannot be operated from a keyboard,
   and no amount of care changes that. So a drawing task is never the
   only route to finishing a step. Every one carries a described route:
   the same synthesis done in words or in structured choices, accepted on
   equal terms and printed into the same PDF. That is not a lesser path
   for people who cannot draw. It is a second correct answer.
   ===================================================================== */
(function () {
'use strict';
var L = window.LAB, el = L.el, $ = L.$, $$ = L.$$;

/* every finished drawing, for the printed submission */
L.drawings = [];

var INK = [
  { id: 'navy',  hex: '#0B1530', name: 'navy' },
  { id: 'terra', hex: '#6E2D24', name: 'red' },
  { id: 'teal',  hex: '#27565D', name: 'teal' },
  { id: 'gold',  hex: '#9A7F32', name: 'gold' }
];
var TOOLS = [
  { id: 'pen',    name: 'Pen' },
  { id: 'line',   name: 'Line' },
  { id: 'arrow',  name: 'Arrow' },
  { id: 'rect',   name: 'Box' },
  { id: 'ellipse',name: 'Circle' },
  { id: 'erase',  name: 'Erase' }
];

/* =====================================================================
   THE SURFACE
   cfg: {
     id, label, instruction, height, background (svg string, optional),
     bucket, alt: { prompt, options[], minWords }, onDone
   }
   ===================================================================== */
function drawpad(cfg) {
  var H = cfg.height || 340;
  /* When a figure sits underneath, the stage takes the figure's exact
     aspect ratio. Without that the SVG letterboxes inside the stage and
     a mark can no longer be converted back into seconds and mmHg. */
  var geom = cfg.geom || null;
  var strokes = [];        /* every stroke, so undo is real and redraw is exact */
  var current = null;
  var tool = 'pen', ink = '#0B1530', width = 3;
  var done = false;

  var wrap = el('div', { class: 'dp' });
  var stage = el('div', { class: 'dp-stage', style: 'height:' + H + 'px' });

  /* the figure being drawn on, if there is one */
  if (cfg.background) {
    var bg = el('div', { class: 'dp-bg' });
    bg.innerHTML = cfg.background;
    stage.appendChild(bg);
  }

  var canvas = el('canvas', {
    class: 'dp-canvas',
    'aria-label': cfg.label + '. A drawing surface. If you would rather not draw, or cannot, use the described route below, which is worth exactly the same.'
  });
  stage.appendChild(canvas);
  var ctx = canvas.getContext('2d');

  function sizeCanvas() {
    var r = stage.getBoundingClientRect();
    if (!r.width) return;
    if (geom) {
      H = Math.round(r.width * geom.H / geom.W);
      stage.style.height = H + 'px';
      r = stage.getBoundingClientRect();
    }
    /* two device pixels per css pixel, so the printed PDF stays sharp */
    var scale = Math.min(2 * (window.devicePixelRatio || 1), 3);
    canvas.width = Math.round(r.width * scale);
    canvas.height = Math.round(H * scale);
    canvas.style.width = r.width + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    redraw();
  }

  function redraw() {
    var r = stage.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width || 1000, H);
    strokes.forEach(paint);
    if (current) paint(current);
  }

  function paint(s) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = s.ink;
    ctx.lineWidth = s.w;
    if (s.tool === 'erase') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = s.w * 5;
    }
    var p = s.pts;
    if (!p.length) { ctx.restore(); return; }
    ctx.beginPath();
    if (s.tool === 'pen' || s.tool === 'erase') {
      ctx.moveTo(p[0][0], p[0][1]);
      for (var i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
      ctx.stroke();
    } else {
      var a = p[0], b = p[p.length - 1];
      if (s.tool === 'line' || s.tool === 'arrow') {
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        if (s.tool === 'arrow') {
          var ang = Math.atan2(b[1] - a[1], b[0] - a[0]), h = 9 + s.w * 2;
          ctx.beginPath();
          ctx.moveTo(b[0], b[1]);
          ctx.lineTo(b[0] - h * Math.cos(ang - 0.4), b[1] - h * Math.sin(ang - 0.4));
          ctx.moveTo(b[0], b[1]);
          ctx.lineTo(b[0] - h * Math.cos(ang + 0.4), b[1] - h * Math.sin(ang + 0.4));
          ctx.stroke();
        }
      } else if (s.tool === 'rect') {
        ctx.strokeRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
      } else if (s.tool === 'ellipse') {
        ctx.ellipse((a[0] + b[0]) / 2, (a[1] + b[1]) / 2,
          Math.abs(b[0] - a[0]) / 2, Math.abs(b[1] - a[1]) / 2, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (done) return;
    /* a finger scrolls the page; a stylus or a mouse draws */
    if (e.pointerType === 'touch' && !wrap.dataset.finger) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    current = { tool: tool, ink: ink, w: width, pts: [pos(e)] };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!current) return;
    e.preventDefault();
    current.pts.push(pos(e));
    redraw();
  });
  function endStroke() {
    if (!current) return;
    if (current.pts.length > 1 || current.tool === 'pen') strokes.push(current);
    current = null;
    redraw();
    say(strokes.length + ' mark' + (strokes.length === 1 ? '' : 's') + ' on the canvas.');
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', endStroke);

  /* ---------- the tool bar ---------- */
  var live = el('p', { class: 'note', 'aria-live': 'polite', style: 'margin:10px 0 0' });
  function say(t) { live.textContent = t; }

  var toolRow = el('div', { class: 'dp-tools', role: 'group', 'aria-label': 'Drawing tools' });
  var toolBtns = {};
  TOOLS.forEach(function (t) {
    var b = el('button', {
      class: 'dp-t', type: 'button', 'aria-pressed': t.id === 'pen' ? 'true' : 'false',
      text: t.name,
      onclick: function () {
        tool = t.id;
        Object.keys(toolBtns).forEach(function (k) {
          toolBtns[k].setAttribute('aria-pressed', k === t.id ? 'true' : 'false');
        });
        say(t.name + ' selected.');
      }
    });
    toolBtns[t.id] = b;
    toolRow.appendChild(b);
  });

  var inkRow = el('div', { class: 'dp-tools', role: 'group', 'aria-label': 'Ink color' });
  var inkBtns = {};
  /* A pad can hold a color back. On a figure where the answer is drawn in
     red, red is not offered to the student, so the two lines can never be
     the same color by accident. */
  var palette = cfg.inks
    ? INK.filter(function (k) { return cfg.inks.indexOf(k.id) >= 0; })
    : INK;
  if (palette.length) ink = palette[0].hex;
  palette.forEach(function (c) {
    var b = el('button', {
      class: 'dp-ink', type: 'button', 'aria-pressed': c.hex === ink ? 'true' : 'false',
      'aria-label': c.name + ' ink', style: '--ink:' + c.hex,
      onclick: function () {
        ink = c.hex;
        Object.keys(inkBtns).forEach(function (k) {
          inkBtns[k].setAttribute('aria-pressed', k === c.id ? 'true' : 'false');
        });
        say(c.name + ' ink selected.');
      }
    });
    inkBtns[c.id] = b;
    inkRow.appendChild(b);
  });

  var wId = 'dpw-' + cfg.id;
  var wIn = el('input', {
    type: 'range', min: '1', max: '10', value: '3', id: wId,
    oninput: function () { width = parseInt(wIn.value, 10); }
  });

  var undoBtn = el('button', {
    class: 'btn sec sm', type: 'button', text: 'Undo',
    onclick: function () {
      if (done || !strokes.length) return;
      strokes.pop(); redraw();
      say('Last mark removed. ' + strokes.length + ' left.');
    }
  });
  var clearBtn = el('button', {
    class: 'btn sec sm', type: 'button', text: 'Clear',
    onclick: function () {
      if (done) return;
      strokes = []; redraw(); say('Canvas cleared.');
    }
  });
  var fingerBtn = el('button', {
    class: 'btn sec sm', type: 'button', 'aria-pressed': 'false',
    text: 'Finger drawing: off',
    onclick: function () {
      var on = !wrap.dataset.finger;
      if (on) wrap.dataset.finger = '1'; else delete wrap.dataset.finger;
      fingerBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      fingerBtn.textContent = 'Finger drawing: ' + (on ? 'on' : 'off');
      say('Finger drawing ' + (on ? 'on. One finger now draws instead of scrolling.' : 'off. One finger scrolls the page again.'));
    }
  });

  /* ---------- the described route, which is not a fallback ---------- */
  var altBox = null, altDone = false;
  if (cfg.alt) {
    var taId = 'dpa-' + cfg.id;
    var ta = el('textarea', { id: taId, rows: '4', 'aria-label': cfg.alt.label || (cfg.label + ', described in words') });
    var min = cfg.alt.minWords || 20;
    var count = el('p', { class: 'note', style: 'margin:8px 0 0', 'aria-live': 'polite' });
    ta.addEventListener('input', function () {
      var w = ta.value.trim().split(/\s+/).filter(Boolean).length;
      count.textContent = w + ' word' + (w === 1 ? '' : 's') + '. At least ' + min + ' are needed.';
    });
    var altFb = el('p', { class: 'ws-fb' }); altFb.hidden = true;
    var altBtn = el('button', {
      class: 'btn sm', type: 'button', text: 'Record my description',
      onclick: function () {
        var w = ta.value.trim().split(/\s+/).filter(Boolean).length;
        altFb.hidden = false;
        if (w < min) {
          altFb.className = 'ws-fb warn';
          altFb.textContent = 'That is ' + w + ' words. Describe what you would have drawn: what goes where, what connects to what, and which way it points.';
          ta.focus(); return;
        }
        altDone = true;
        ta.readOnly = true; altBtn.hidden = true;
        altFb.className = 'ws-fb ok';
        altFb.innerHTML = '<strong>Recorded. </strong>This is your answer to this step and it prints on your PDF.';
        finish('described');
      }
    });
    altBox = el('details', { class: 'dp-alt' }, [
      el('summary', { text: 'Answer this in words instead' }),
      el('div', { class: 'dp-alt-body' }, [
        el('p', { class: 'note', html: cfg.alt.prompt }),
        el('label', { class: 'sr-only', for: taId, text: cfg.alt.label || cfg.label }),
        ta, count,
        el('div', { class: 'btnrow', style: 'margin-top:10px' }, altBtn),
        altFb
      ])
    ]);
  }

  /* ---------- committing ---------- */
  var fb = el('p', { class: 'ws-fb' }); fb.hidden = true;
  var doneBtn = el('button', {
    class: 'btn', type: 'button', text: 'This is my answer',
    onclick: function () {
      if (done) return;
      if (!strokes.length) {
        fb.hidden = false;
        fb.className = 'ws-fb warn';
        fb.textContent = 'There is nothing on the canvas yet. Draw your answer, or open the described route below and answer in words instead. Either one counts.';
        return;
      }
      finish('drawn');
    }
  });

  function finish(how) {
    if (done) return;
    done = true;
    canvas.style.cursor = 'default';
    doneBtn.hidden = true;
    fb.hidden = false;
    fb.className = 'ws-fb ok';
    fb.innerHTML = how === 'drawn'
      ? '<strong>Recorded. </strong>Your drawing is saved into your submission and appears on the PDF.'
      : '<strong>Recorded. </strong>Your description is saved into your submission and appears on the PDF.';
    [undoBtn, clearBtn, fingerBtn].forEach(function (b) { b.disabled = true; });
    Object.keys(toolBtns).forEach(function (k) { toolBtns[k].disabled = true; });
    Object.keys(inkBtns).forEach(function (k) { inkBtns[k].disabled = true; });
    wIn.disabled = true;

    var rec = { label: cfg.label, how: how, image: '',
                described: cfg.alt && altDone ? $('#dpa-' + cfg.id).value.trim() : '' };
    L.drawings.push(rec);
    if (cfg.bucket) L.score(cfg.bucket, true);

    var line = how === 'drawn' ? readLine() : null;

    /* Hand back the tools the caller needs: what the student drew in real
       units, a way to lay the truth underneath it, and a way to re-save the
       picture once both lines are showing. */
    if (cfg.onDone) {
      cfg.onDone(how, line, function (svg) {
        setBackground(svg);
        /* let the new figure paint, then save the comparison for the PDF */
        setTimeout(function () { flatten(function (d) { rec.image = d; }); }, 60);
      });
    }
    if (how === 'drawn') flatten(function (d) { if (!rec.image) rec.image = d; });
  }

  /* swap what sits under the marks. The student's line does not move. */
  function setBackground(svg) {
    var b = stage.querySelector('.dp-bg');
    if (!b) { b = el('div', { class: 'dp-bg' }); stage.insertBefore(b, canvas); }
    b.innerHTML = svg;
  }

  /* read the drawn line back in real units, so the feedback can talk
     about what the student actually drew rather than in generalities */
  function readLine() {
    var r = stage.getBoundingClientRect();
    if (!geom || !r.width) return null;
    var sx = geom.W / r.width, sy = geom.H / H;
    var pts = [];
    strokes.forEach(function (s) {
      if (s.tool === 'erase') return;
      s.pts.forEach(function (p) {
        var d = geom.toData(p[0] * sx, p[1] * sy);
        /* marks made outside the plotted area are not readable as data,
           so they are left out of the comparison rather than reported as
           an impossible pressure at a negative time */
        if (d[0] < geom.xmin || d[0] > geom.xmax) return;
        if (d[1] < geom.ymin || d[1] > geom.ymax) return;
        pts.push(d);
      });
    });
    if (pts.length < 2) return null;
    pts.sort(function (a, b) { return a[0] - b[0]; });
    return {
      pts: pts,
      at: function (x) {
        var best = pts[0], bd = Math.abs(pts[0][0] - x);
        for (var i = 1; i < pts.length; i++) {
          var d = Math.abs(pts[i][0] - x);
          if (d < bd) { bd = d; best = pts[i]; }
        }
        return bd <= (geom.xmax - geom.xmin) * 0.06 ? best[1] : null;
      },
      lowest: pts.reduce(function (a, p) { return p[1] < a[1] ? p : a; }, pts[0]),
      first: pts[0], last: pts[pts.length - 1]
    };
  }

  /* The figure and the marks on it become one image, so the PDF shows the
     prediction sitting on the graph it was drawn on, with the real line
     underneath it. The background is an SVG, so it has to be rasterised
     first, which means this is asynchronous. */
  function flatten(cb) {
    var r = stage.getBoundingClientRect();
    var scale = 2;
    var out = document.createElement('canvas');
    out.width = Math.round(r.width * scale);
    out.height = Math.round(H * scale);
    var o = out.getContext('2d');
    o.fillStyle = '#ffffff';
    o.fillRect(0, 0, out.width, out.height);

    function done() {
      o.drawImage(canvas, 0, 0, out.width, out.height);
      try { cb(out.toDataURL('image/png')); } catch (e) { cb(''); }
    }

    var bgEl = stage.querySelector('.dp-bg svg');
    if (!bgEl) { done(); return; }
    try {
      var svg = new XMLSerializer().serializeToString(bgEl);
      if (svg.indexOf('xmlns=') < 0) {
        svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      var img = new Image();
      img.onload = function () {
        o.drawImage(img, 0, 0, out.width, out.height);
        done();
      };
      img.onerror = function () { done(); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    } catch (e) { done(); }
  }

  wrap.appendChild(el('p', { class: 'dp-inst', html: cfg.instruction || '' }));
  wrap.appendChild(el('div', { class: 'dp-bar' }, [
    toolRow, inkRow,
    el('div', { class: 'dp-w' }, [
      el('label', { for: wId, class: 'dp-wl', text: 'Thickness' }), wIn
    ])
  ]));
  wrap.appendChild(stage);
  wrap.appendChild(el('div', { class: 'btnrow' }, [doneBtn, undoBtn, clearBtn, fingerBtn]));
  wrap.appendChild(fb);
  wrap.appendChild(live);
  if (altBox) wrap.appendChild(altBox);

  setTimeout(sizeCanvas, 0);
  window.addEventListener('resize', function () { setTimeout(sizeCanvas, 60); });

  return { node: wrap, isDone: function () { return done; }, resize: sizeCanvas };
}
L.drawpad = drawpad;

/* =====================================================================
   PREDICT ON THE GRAPH
   The student draws the curve they expect straight onto the axes, then
   the real one is revealed underneath their line. Their prediction stays
   on screen, so they are looking at the gap between what they thought
   and what happened, which is the entire point of predicting.
   ===================================================================== */
function predictOnGraph(cfg) {
  /* cfg: {id, label, instruction, blankFig, realFig, height, alt, bucket, after} */
  var slot = el('div');
  var pad = drawpad({
    id: cfg.id, label: cfg.label, instruction: cfg.instruction,
    height: cfg.height || 380, background: cfg.blankFig,
    bucket: cfg.bucket, alt: cfg.alt,
    onDone: function () {
      var reveal = el('div', { class: 'card', style: 'margin-top:18px' }, [
        L.kicker('Now the real one'),
        el('h3', { text: cfg.revealTitle || 'What actually happens' }),
        el('figure', { class: 'fig' }, [
          el('div', { html: cfg.realFig }),
          cfg.revealCaption ? el('figcaption', { html: cfg.revealCaption }) : null
        ]),
        cfg.after ? el('p', { html: cfg.after, style: 'margin-top:14px' }) : null
      ]);
      slot.appendChild(reveal);
      L.wireTerms(reveal);
      reveal.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });
  return el('div', null, [pad.node, slot]);
}
L.predictOnGraph = predictOnGraph;
})();
