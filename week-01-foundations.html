<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 1, Foundations and Whole Body Control</title>
<meta name="description" content="BIO 005 lab for week one. Control loops, mean arterial pressure, pulse pressure, the baroreflex on standing, and reading the oxygen dissociation curve.">
<style>

:root{
  --navy:#0B1530; --navy-2:#0A1322; --navy-darkest:#060A18; --navy-tint:#ECEFF4;
  --terra:#6E2D24; --terra-dark:#5A1212; --terra-text:#7A2F18;
  --gold:#C9A14A; --gold-text:#5F4514; --teal-text:#27565D;
  --ink:#0A1322; --ink-muted:#414B5C; --rule:#7F8798; --rule-soft:#DCE0E6;
  --off:#FAFAF9; --white:#ffffff;
  --shadow:0 1px 2px rgba(10,19,34,.05), 0 2px 6px rgba(10,19,34,.05);
  --shadow-lift:0 2px 4px rgba(10,19,34,.05), 0 12px 28px rgba(10,19,34,.10);
  --shadow-btn:0 1px 2px rgba(10,19,34,.12);
  --shadow-btn-lift:0 4px 12px rgba(10,19,34,.18);
  --hair:#E7EAEF;
  --lift:transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
  --r-block:8px; --r-card:16px;
  --display:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  --body:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--off);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;font-variant-numeric:lining-nums}
em,i,cite,dfn,var,address{font-style:normal!important}
h1,h2,h3,h4,h5{font-family:var(--display);font-style:normal;line-height:1.22;margin:0 0 .5em}
h1{font-weight:800;font-size:clamp(1.6rem,3.6vw,2.3rem)}
h2{font-weight:800;font-size:clamp(1.3rem,2.6vw,1.75rem);color:var(--navy)}
h3{font-weight:700;font-size:1.13rem;color:var(--terra)}
h4{font-weight:700;font-size:1rem;color:var(--navy);margin-bottom:.35em}
p{margin:0 0 1em}
a{color:var(--terra);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--terra-dark)}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px;border-radius:4px}
.on-red :focus-visible{outline-color:#fff}
.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;padding:12px 18px;z-index:99;border-radius:0 0 var(--r-block) 0;font-family:var(--display);font-weight:700}
.skip:focus{left:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- white brand bar ---------- */
.brandbar{background:#fff;padding:14px 0}
.brandbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandbar svg{display:block;width:46px;height:46px;flex:0 0 auto}
.brandlines{font-family:var(--display);line-height:1.24;margin-right:auto}
.brandlines .b1{display:block;font-weight:800;font-size:1.05rem;color:var(--navy)}
.brandlines .b2{display:block;font-weight:700;font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;color:var(--terra)}

/* ---------- header ---------- */
.site-header{background:var(--terra);color:#fff;padding:22px 0 20px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#FEF8EE;margin:0 0 8px}
.site-header h1{color:#fff;margin-bottom:.3em}
.site-header .lede{color:#fff;max-width:60ch;margin:0;font-size:1.02rem;opacity:.96}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-block;background:var(--gold);color:var(--navy);font-family:var(--display);font-weight:700;font-size:.76rem;letter-spacing:.04em;padding:5px 13px;border-radius:99px}
.chip.ghost{background:#fff;color:var(--navy)}

/* ---------- tabs ---------- */
.tabbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--hair);box-shadow:0 1px 3px rgba(10,19,34,.06)}
.tablist{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding:0}
.tab{position:relative;flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:14px 13px;font-family:var(--display);font-weight:700;font-size:.92rem;color:var(--ink-muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--navy);background:var(--off)}
.tab[aria-selected="true"]{color:var(--terra);border-bottom-color:var(--terra)}
.tab[data-locked="true"]{color:#5C6577}
.tab[data-locked="true"]::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:2px;background:repeating-linear-gradient(90deg,#7F8798 0 3px,transparent 3px 7px)}
.tab[data-locked="true"]:hover{color:var(--navy);background:var(--off)}
.tab.just-opened{border-bottom-color:#9A7F32}
.gate-msg{margin:0;padding:11px 0 13px;font-size:.92rem;color:var(--navy);border-top:1px solid var(--rule-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gate-msg[hidden]{display:none}
.gate-msg strong{font-family:var(--display)}
.panel{padding:34px 0 60px}
.panel[hidden]{display:none}
.panel-intro{max-width:70ch}

/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--hair);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px 26px;margin:0 0 20px;transition:var(--lift)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.card.tight{padding:16px 18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2w{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.surface{background:#fff;border:1px solid var(--hair);border-radius:var(--r-block);padding:18px 20px;box-shadow:var(--shadow)}
.note{font-size:.92rem;color:var(--ink-muted)}
.kicker{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);margin:0 0 6px}
.kicker.teal{color:var(--teal-text)}
.kicker.gold{color:var(--gold-text)}

/* ---------- buttons ---------- */
.btn{font-family:var(--display);font-weight:700;font-size:.93rem;letter-spacing:.005em;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:12px 20px;cursor:pointer;line-height:1.2;box-shadow:var(--shadow-btn);transition:var(--lift),background 160ms ease;display:inline-flex;align-items:center;gap:9px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-btn-lift)}
.btn:active{transform:translateY(0);box-shadow:var(--shadow-btn)}
.btn:hover{background:var(--navy-darkest)}
.btn.sec{background:#fff;color:var(--navy);border-color:var(--rule);box-shadow:var(--shadow)}
.btn.sec:hover{background:#fff;border-color:var(--navy);box-shadow:var(--shadow-lift)}
.btn.gold{background:#fff;color:var(--gold-text);border-color:#9A7F32}
.btn.gold:hover{background:#fff;border-color:var(--gold-text)}
.btn.cta{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.cta:hover{background:var(--terra-dark);border-color:var(--terra-dark)}
.btn .arw{font-size:1.05em;line-height:1;transition:transform 200ms ease}
.btn:hover .arw{transform:translateX(3px)}
.btn.sm{padding:8px 13px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--navy)}
.field .hint{font-size:.8rem;color:var(--ink-muted)}
input[type=number],input[type=text],select{font-family:var(--body);font-size:1rem;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r-block);background:#fff;color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--terra)}
.slider-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.slider-val{font-family:var(--display);font-weight:800;color:var(--terra);font-size:1.05rem;white-space:nowrap}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:.93rem}
caption{text-align:left;font-family:var(--display);font-weight:700;color:var(--navy);padding-bottom:8px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
thead th{font-family:var(--display);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--rule)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.flag-low{color:var(--terra);font-weight:700}
.flag-ok{color:var(--teal-text);font-weight:700}
.flag-high{color:var(--gold-text);font-weight:700}

/* ---------- disclosure ---------- */
.disc{border:1px solid var(--hair);border-radius:var(--r-block);background:#fff;margin-bottom:10px;box-shadow:var(--shadow);transition:var(--lift)}
.disc:hover{box-shadow:var(--shadow-lift)}
.disc>button{width:100%;text-align:left;background:none;border:0;padding:14px 16px;font-family:var(--display);font-weight:700;font-size:1rem;color:var(--navy);cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.disc>button:hover{background:var(--off)}
.disc .mark{color:var(--terra);font-weight:800;flex:0 0 auto}
.disc .body{padding:0 16px 16px;border-top:1px solid var(--rule-soft)}
.disc .body[hidden]{display:none}

/* ---------- quiz ---------- */
.qcard{background:#fff;border:1px solid var(--hair);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:20px;transition:var(--lift)}
.qcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.opts{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:9px}
.opt{width:100%;text-align:left;font-family:var(--body);font-size:.98rem;background:#fff;border:1px solid var(--rule);border-radius:var(--r-block);padding:12px 14px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;color:var(--ink)}
.opt{transition:var(--lift),background 160ms ease}
.opt:hover:not([disabled]){background:#fff;border-color:var(--navy);box-shadow:0 3px 10px rgba(10,19,34,.09);transform:translateY(-1px)}
.opt .ltr{font-family:var(--display);font-weight:800;color:var(--ink-muted);flex:0 0 auto}
.opt.correct{background:var(--terra);border-color:var(--terra);color:#fff}
.opt.correct .ltr{color:var(--gold)}
.opt.wrong{background:var(--navy-tint);border-color:var(--navy);color:var(--navy)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:15px 17px;border-radius:var(--r-block);background:var(--off);border:1px solid var(--hair);font-size:.95rem}
.fb strong{font-family:var(--display)}
.progress{height:8px;background:var(--navy-tint);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.progress span{display:block;height:100%;background:var(--terra);border-radius:99px;transition:width .3s ease}

/* ---------- explain it like I am 10 ---------- */
.eli-toggle{font-family:var(--display);font-weight:700;font-size:.82rem;background:#fff;color:var(--gold-text);border:1px solid #9A7F32;border-radius:99px;padding:8px 17px;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:8px;margin:2px 0 12px;box-shadow:var(--shadow);transition:var(--lift)}
.eli-toggle::before{content:"";width:6px;height:6px;border-radius:50%;background:#9A7F32;flex:0 0 auto}
.eli-toggle:hover{background:#fff;border-color:var(--gold-text);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.eli-toggle[aria-expanded="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.eli-toggle[aria-expanded="true"]::before{background:var(--gold)}
.eli-box{background:var(--off);border:1px solid var(--rule-soft);border-radius:var(--r-block);padding:15px 17px;margin:0 0 14px;font-size:1rem;line-height:1.66}
.eli-box[hidden]{display:none}
.eli-box p{margin:0 0 .7em}
.eli-box p:last-child{margin-bottom:0}
.eli-box .eli-head{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text);margin-bottom:6px;display:block}
.hdr-eli{font-family:var(--display);font-weight:700;font-size:.8rem;background:#fff;color:var(--gold-text);border:1px solid #9A7F32;border-radius:99px;padding:9px 18px;cursor:pointer;line-height:1.2;box-shadow:var(--shadow);transition:var(--lift)}
.hdr-eli:hover{border-color:var(--gold-text);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.hdr-eli[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.hdr-eli:hover{background:var(--off)}

/* ---------- figures ---------- */
figure{margin:0}
.fig{background:#fff;border:1px solid var(--hair);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.fig svg{display:block;width:100%;height:auto}
figcaption{font-size:.88rem;color:var(--ink-muted);margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;font-family:var(--display);font-weight:600;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:16px;height:4px;border-radius:2px;display:inline-block}

/* ---------- study page ---------- */
.study-sec{scroll-margin-top:64px;padding-top:6px;margin-bottom:34px}
.study-sec>h2{padding-bottom:10px;border-bottom:1px solid var(--hair)}
.toc{margin:0;padding-left:1.3em;font-family:var(--display);font-weight:600;font-size:.93rem;columns:2;column-gap:30px}
.toc li{margin-bottom:5px;break-inside:avoid}
.toc a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--rule-soft)}
.toc a:hover{color:var(--terra);border-bottom-color:var(--terra)}
@media(max-width:640px){.toc{columns:1}}
ol.recap li{margin-bottom:.6em}

/* ---------- clickable terms ---------- */
.term{font:inherit;background:none;border:0;padding:0 1px;color:var(--terra);font-weight:700;border-bottom:2px dotted var(--terra);cursor:pointer;line-height:inherit}
.term:hover{background:var(--navy-tint)}
.term[aria-expanded="true"]{background:var(--terra);color:#fff;border-bottom-color:var(--terra)}
.term-def{display:inline-block;margin:5px 4px 5px 6px;padding:7px 11px;background:var(--off);border:1px solid var(--rule-soft);border-left:3px solid var(--terra);border-radius:6px;font-size:.88rem;line-height:1.5;color:var(--ink);max-width:52ch;vertical-align:top;font-weight:400}
.term-def[hidden]{display:none}
.term-def b{font-family:var(--display);color:var(--terra)}

/* ---------- formulas ---------- */
.fx{background:var(--off);border:1px solid var(--hair);border-radius:var(--r-block);padding:13px 16px;margin:0 0 12px}
.fx-top{display:flex;align-items:flex-start;gap:12px}
.fx-top .fx-eq{flex:1 1 auto;margin:0}
.fx-info{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid #9A7F32;box-shadow:var(--shadow);transition:var(--lift);background:#fff;color:var(--gold-text);font-family:var(--display);font-weight:800;font-size:.92rem;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.fx-info:hover{background:#fff;border-color:var(--navy);color:var(--navy)}
.fx-info[aria-expanded="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.fx-eq{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--navy);line-height:1.5;font-variant-numeric:tabular-nums lining-nums}
.fx-eq b{color:var(--terra);font-weight:800}
.fx-note{font-size:.85rem;color:var(--ink-muted);margin:5px 0 0}
.fx-key{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--rule-soft);font-size:.8rem;color:var(--ink-muted)}
.fx-key span{white-space:nowrap}
.fx-key b{font-family:var(--display);font-weight:800;color:var(--navy);font-size:.82rem}
.fx-list{display:grid;gap:10px;margin:0 0 14px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 5px}
.frac .num{border-bottom:2px solid var(--navy);padding:0 7px 2px}
.frac .den{padding:2px 7px 0}

/* ---------- decision chart ---------- */
.fc{display:flex;flex-direction:column;align-items:stretch}
.fc-node{background:#fff;border:2px solid var(--navy);border-radius:var(--r-block);padding:16px 18px;box-shadow:var(--shadow)}
.fc-node h4{margin:0 0 .4em;font-size:1.05rem}
.fc-tag{font-family:var(--display);font-weight:800;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);display:block;margin-bottom:5px}
.fc-end{border-color:var(--terra);background:var(--off)}
.fc-end h4{color:var(--terra);font-size:1.15rem}
.fc-end .fc-tag{color:var(--terra)}
.fc-link{height:26px;display:flex;justify-content:center;align-items:stretch}
.fc-link span{width:2px;background:var(--navy);display:block;position:relative}
.fc-link span::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--navy)}
.fc-opts{display:grid;gap:8px;margin-top:12px}
.fc-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-family:var(--body);font-size:.96rem;background:#fff;border:1px solid var(--rule);border-radius:var(--r-block);padding:11px 13px;cursor:pointer;color:var(--ink)}
.fc-opt:hover:not([disabled]){background:var(--navy-tint);border-color:var(--navy)}
.fc-opt .fc-key{font-family:var(--display);font-weight:800;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-text);flex:0 0 auto;min-width:52px;padding-top:2px}
.fc-opt.taken{background:var(--terra);border-color:var(--terra);color:#fff}
.fc-opt.taken .fc-key{color:var(--gold)}
.fc-opt.miss{background:var(--navy-tint);border-color:var(--navy);color:var(--navy)}
.fc-opt[disabled]{cursor:default}

/* ---------- drag and drop matching ---------- */
.dnd-tray{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 14px}
.chip-drag{font-family:var(--display);font-weight:800;font-size:.9rem;background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:99px;padding:9px 17px;cursor:grab;line-height:1.2;display:inline-flex;flex-direction:column;align-items:flex-start}
.chip-drag small{font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--ink-muted);letter-spacing:0;text-transform:none}
.chip-drag:hover{background:var(--navy-tint)}
.chip-drag[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:#fff}
.chip-drag[aria-pressed="true"] small{color:var(--gold)}
.chip-drag.dragging{opacity:.45}
.chip-drag.placed{display:none}
.dnd-hint{font-size:.9rem;color:var(--ink-muted);margin:0 0 8px}
.brk.drop-ready rect{fill:rgba(201,161,74,.30)}
.brk.drop-over rect{fill:rgba(139,58,46,.22);stroke:#8B3A2E;stroke-width:3}

/* ---------- readouts ---------- */
.readout{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:#fff;border:1px solid var(--rule-soft);border-radius:var(--r-block);padding:12px 14px;box-shadow:var(--shadow)}
.stat .lab{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:2px}
.stat .val{display:block;font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--navy);line-height:1.18}
.stat .sub{display:block;font-size:.78rem;color:var(--ink-muted);line-height:1.35;margin-top:2px}
.stat.alert{border-color:var(--terra);border-width:2px}
.stat.alert .val{color:var(--terra)}
.stat.good{border-color:#9A7F32;border-width:2px}

.alertbox{border:1px solid var(--rule-soft);border-left-width:1px;background:#fff;border-radius:var(--r-block);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.alertbox .t{font-family:var(--display);font-weight:800;color:var(--terra);display:block;margin-bottom:3px}
.alertbox.okline .t{color:var(--teal-text)}

ul.tight,ol.tight{margin:.2em 0 1em;padding-left:1.25em}
ul.tight li,ol.tight li{margin-bottom:.4em}
.two-col{columns:2;column-gap:32px}
@media(max-width:700px){.two-col{columns:1}}

/* ---------- footer ---------- */
.site-footer{background:var(--navy-darkest);color:#fff;padding:30px 0;margin-top:20px}
.site-footer p{margin:0;font-size:.9rem;color:#fff}
.site-footer .name{font-family:var(--display);font-weight:800;font-size:1.02rem}
.site-footer .muted{opacity:.75;font-size:.82rem;margin-top:6px}

.submit-head{display:none}
.submit-head .sh-line{font-family:var(--display);font-weight:700;font-size:1rem;color:var(--navy)}
@media print{
  @page{margin:12mm 12mm 14mm}
  .tabbar,.brandbar,.site-header,.site-footer,.btnrow,.btn,.gate-msg{display:none!important}
  .submit-head{display:block!important;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .eli-toggle,.hdr-eli,.fx-info,.opts,.fc-opts,.dnd-tray,.progress,.toc{display:none!important}
  .study-sec{margin-bottom:14px}
  .term{color:#000;border-bottom:1px dotted #666;font-weight:700}
  .term-def{display:none!important}
  .eli-box[hidden]{display:none!important}
  .panel[hidden]{display:none}
  html,body{font-size:10pt;line-height:1.34}
  p{margin:0 0 .55em}
  h1{font-size:16pt;margin:0 0 .3em}
  h2{font-size:13pt;margin:.6em 0 .25em}
  h3{font-size:11pt;margin:.5em 0 .2em}
  h4{font-size:10pt;margin:.4em 0 .15em}
  h2,h3,h4{break-after:avoid}
  table{font-size:9pt}
  th,td{padding:3px 5px}
  caption{font-size:9.5pt;padding-bottom:4px}
  .card,.qcard,.surface,.fig,.fc-node,.alertbox,.fx{box-shadow:none;border:1px solid #999;break-inside:avoid;padding:8px 10px;margin-bottom:8px;border-radius:3px}
  .grid{gap:8px}
  .readout{gap:6px;grid-template-columns:repeat(4,1fr)}
  .stat{padding:5px 7px;border:1px solid #bbb}
  .stat .val{font-size:11pt}
  .stat .lab,.stat .sub{font-size:7.5pt}
  .note{font-size:9pt}
  .fig svg{max-height:170mm}
  .fx-eq{font-size:10.5pt}
  .scroll-x{overflow:visible}
  a[href]::after{content:""}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* =====================================================================
   ADDITIONS THE SHARED ENGINE BRINGS
   Everything above this line came from the pulmonary lab. Everything
   below is new machinery every week page can use.
   ===================================================================== */

/* ---------- generic drop targets, for matching that is not on an SVG ---------- */
.dropgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:4px 0 0}
.dropbox{background:#fff;border:1px dashed var(--rule);border-radius:var(--r-block);padding:15px 17px;min-height:104px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%;box-shadow:var(--shadow);transition:var(--lift)}
.dropbox .role{font-family:var(--display);font-weight:800;font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-muted)}
.dropbox .slot{font-family:var(--display);font-weight:700;font-size:1rem;color:#454B58}
.dropbox .why{font-size:.82rem;color:var(--ink-muted);line-height:1.42}
.dropbox:hover:not(.hit){background:#fff;border-color:var(--navy);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.dropbox.drop-ready{border-color:#9A7F32;border-style:solid;background:rgba(201,161,74,.14)}
.dropbox.drop-over{border-color:var(--terra);border-style:solid;background:rgba(115,23,23,.10)}
.dropbox.hit{border-style:solid;border-color:var(--navy);background:#fff;cursor:default;box-shadow:0 2px 5px rgba(10,19,34,.07), 0 8px 18px rgba(10,19,34,.07);transform:none}
.dropbox.hit .slot{color:var(--navy)}
.dropbox.miss{border-color:var(--terra);background:rgba(115,23,23,.10)}
.loopstrip{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:stretch}

/* ---------- calculation table with blanks the student fills ---------- */
.dt-wrap{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:.92rem}
.dt th,.dt td{padding:7px 9px;border-bottom:1px solid var(--rule-soft);text-align:left;vertical-align:middle}
.dt thead th{font-family:var(--display);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--rule);white-space:nowrap}
.dt td.num,.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
.dt tbody tr:nth-child(even){background:var(--off)}
.dt input{width:6.4em;padding:6px 8px;font-size:.92rem;text-align:right;font-variant-numeric:tabular-nums;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink)}
.dt input.ok{border-color:var(--teal-text);border-width:2px;background:#fff}
.dt input.bad{border-color:var(--terra);border-width:2px;background:rgba(115,23,23,.07)}
.dt .cellnote{display:block;font-size:.76rem;color:var(--ink-muted);margin-top:3px;max-width:22ch}
.dt-legend{font-size:.85rem;color:var(--ink-muted);margin:0 0 10px}
.dt .rowflag{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}

/* ---------- seeded case stamp ---------- */
.caseline{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;background:var(--navy);color:#fff;border-radius:12px;padding:14px 20px;margin:0 0 20px;box-shadow:0 2px 5px rgba(10,19,34,.14), 0 10px 24px rgba(10,19,34,.12)}
.caseline .cl-k{font-family:var(--display);font-weight:800;font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gold)}
.caseline .cl-v{font-family:var(--display);font-weight:700;font-size:.98rem;color:#fff}

/* ---------- predict then check ----------
   No heavy outline. These two read as a pair because of the badge and
   the way they sit off the page, not because of a border drawn round
   them. The predict card sits highest, since it is the one being asked
   to do something. */
.predict,.check{border:1px solid var(--hair)}
.predict{box-shadow:0 2px 5px rgba(10,19,34,.06), 0 14px 30px rgba(10,19,34,.09)}
.predict:hover{box-shadow:0 3px 7px rgba(10,19,34,.07), 0 20px 40px rgba(10,19,34,.12)}
.check{box-shadow:var(--shadow)}
.predict>p:last-of-type,.check>p:last-of-type{margin-bottom:0}

.stepnum{font-family:var(--display);font-weight:800;font-size:.66rem;letter-spacing:.15em;
  text-transform:uppercase;color:#fff;background:var(--navy);border-radius:99px;
  padding:6px 14px 5px;display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(10,19,34,.16)}
.stepnum::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.stepnum.alt{background:var(--terra);box-shadow:0 1px 2px rgba(115,23,23,.24)}
.stepnum.alt::before{background:var(--gold)}

/* a call to action that has been used steps back instead of greying out */
.btn.cta.spent,.btn.cta.spent[disabled]{background:#fff;color:var(--terra);border-color:#D8C4C4;
  box-shadow:none;opacity:1;transform:none;cursor:default}
.btn.cta.spent .arw{transform:rotate(90deg)}
.btn.cta.spent:hover{transform:none;box-shadow:none}

/* ---------- figure point readout ---------- */
.pt-read{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pt-btn{font-family:var(--display);font-weight:700;font-size:.85rem;background:#fff;border:1px solid var(--rule);border-radius:99px;padding:8px 16px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);transition:var(--lift)}
.pt-btn:hover{background:#fff;border-color:var(--navy);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.pt-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- label chips carry the same finish ---------- */
.chip-drag{box-shadow:var(--shadow);transition:var(--lift)}
.chip-drag:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.chip-drag[aria-pressed="true"]{box-shadow:0 2px 6px rgba(115,23,23,.24), 0 10px 22px rgba(115,23,23,.18)}

/* ---------- decision chart nodes lift too ---------- */
.fc-node{transition:var(--lift)}
.fc-node:hover{box-shadow:var(--shadow-lift)}
.fc-opt{transition:var(--lift),background 160ms ease}
.fc-opt:hover:not([disabled]){background:#fff;border-color:var(--navy);box-shadow:0 3px 10px rgba(10,19,34,.09);transform:translateY(-1px)}

/* ---------- flat in print, no shadows on paper ---------- */
@media print{
  .card,.qcard,.fig,.disc,.predict,.check,.dropbox,.caseline,.chip-drag,.fc-node,.btn{box-shadow:none!important;transform:none!important}
}

/* ---------- objective list on the learn page ---------- */
.objlist{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.objlist li{display:flex;gap:11px;align-items:flex-start;font-size:.97rem}
.objlist .n{font-family:var(--display);font-weight:800;font-size:.8rem;color:#fff;background:var(--terra);border-radius:99px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}

@media print{
  .dropbox{border:1px solid #999;min-height:0;padding:6px 8px}
  .dropgrid{gap:6px}
  .dt input{border:0;padding:0;width:auto}
  .caseline{background:#fff;color:#000;border:1px solid #000;padding:5px 8px}
  .caseline .cl-k,.caseline .cl-v{color:#000}
  .pt-read{display:none!important}
}

/* =====================================================================
   WORKED STEPS
   The spine of the anti shortcut design. A step that is not open yet
   says so in words, not by going gray and silent.
   ===================================================================== */
.ws{display:grid;gap:14px;margin:16px 0 0}
.ws-rule{background:var(--navy);color:#fff;border-radius:12px;padding:14px 18px;font-size:.92rem;line-height:1.55;margin:0 0 16px}
.ws-rule strong{color:var(--gold)}
.ws-step{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--hair);
  border-radius:var(--r-block);padding:16px 18px;box-shadow:var(--shadow);transition:var(--lift)}
.ws-step.locked{background:var(--off);box-shadow:none}
.ws-step.done{border-color:var(--navy)}
.ws-n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;
  font-family:var(--display);font-weight:800;font-size:.86rem;display:inline-flex;align-items:center;
  justify-content:center;margin-top:2px}
.ws-step.locked .ws-n{background:#fff;color:#454B58;border:1px solid var(--rule)}
.ws-step.done .ws-n{background:var(--terra)}
.ws-body{flex:1 1 auto;min-width:0}
.ws-label{display:block;font-family:var(--display);font-weight:700;font-size:1rem;color:var(--navy);margin-bottom:3px}
.ws-prompt{font-size:.9rem;color:var(--ink-muted);margin:0 0 10px;line-height:1.5}
.ws-entry{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ws-entry input{width:8em;padding:10px 12px;font-size:1rem;text-align:right;font-variant-numeric:tabular-nums;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink)}
.ws-entry input:disabled{background:var(--off);color:#454B58}
.ws-entry input.ok{border-color:var(--teal-text);border-width:2px}
.ws-entry input.bad{border-color:var(--terra);border-width:2px}
.ws-entry input[readonly]{background:#fff;font-weight:700}
.ws-unit{font-size:.88rem;color:var(--ink-muted)}
.ws-lock{font-size:.85rem;color:#454B58;margin:9px 0 0;display:flex;align-items:center;gap:8px}
.ws-lock[hidden]{display:none}
.ws-lock svg{width:15px;height:15px;flex:0 0 auto;display:block}
.ws-fb{font-size:.9rem;line-height:1.55;margin:11px 0 0;padding:11px 14px;border-radius:8px;
  background:var(--off);border:1px solid var(--hair);color:var(--ink)}
.ws-fb.ok{border-left:3px solid var(--teal-text)}
.ws-fb.bad{border-left:3px solid var(--terra)}
.ws-fb.warn{border-left:3px solid #9A7F32}
.ws-fb strong{font-family:var(--display)}

/* =====================================================================
   ELIMINATE, the second half of a multiple choice question
   ===================================================================== */
.elim-head{margin:22px 0 14px;padding-top:20px;border-top:1px solid var(--hair)}
.elim-row{background:var(--off);border:1px solid var(--hair);border-radius:var(--r-block);
  padding:14px 16px;margin-bottom:11px}
.elim-opt{font-size:.95rem;margin:0 0 10px;line-height:1.5}
.elim-opt b{font-family:var(--display);color:var(--navy)}
.elim-row select{width:100%;max-width:56ch;font-family:var(--body);font-size:.94rem;padding:10px 12px;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink)}
.elim-row select.ok{border-color:var(--teal-text);border-width:2px}
.elim-row select.bad{border-color:var(--terra);border-width:2px}
.elim-row select:disabled{background:#fff;font-weight:600;color:var(--ink);opacity:1}

/* ---------- other readings from the same shift ---------- */
.decoy{font-size:.82rem;color:var(--ink-muted);margin:14px 0 0;line-height:1.6;
  font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.decoy-k{font-family:var(--display);font-weight:800;font-size:.66rem;letter-spacing:.11em;
  text-transform:uppercase;color:#454B58}

/* =====================================================================
   STEP RAIL
   ===================================================================== */
.rail{list-style:none;display:flex;flex-wrap:wrap;gap:8px 6px;margin:0 0 22px;padding:0}
.rail-item{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--hair);
  border-radius:99px;padding:7px 15px 7px 8px;box-shadow:var(--shadow);font-size:.86rem;color:#454B58}
.rail-n{width:22px;height:22px;border-radius:50%;background:var(--off);border:1px solid var(--rule);
  color:#454B58;font-family:var(--display);font-weight:800;font-size:.74rem;display:inline-flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.rail-t{font-family:var(--display);font-weight:600}
.rail-item.now{border-color:var(--navy);color:var(--navy)}
.rail-item.now .rail-n{background:var(--navy);border-color:var(--navy);color:#fff}
.rail-item.done{border-color:var(--hair);color:var(--terra)}
.rail-item.done .rail-n{background:var(--terra);border-color:var(--terra);color:#fff}
.rail-item.done .rail-n::after{content:"✓";font-size:.72rem}
.rail-item.done .rail-n{font-size:0}

/* ---------- the case header ---------- */
.vitals-strip{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0 0}
.vital{background:#fff;border:1px solid var(--hair);border-radius:var(--r-block);padding:14px 16px;box-shadow:var(--shadow)}
.vital .vk{display:block;font-family:var(--display);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px}
.vital .vv{display:block;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.vital .vu{display:block;font-size:.78rem;color:var(--ink-muted);margin-top:2px}

@media print{
  .ws-rule{background:#fff;color:#000;border:1px solid #000}
  .ws-rule strong{color:#000}
  .ws-step,.elim-row,.rail-item,.vital{box-shadow:none;border:1px solid #999}
  .rail{display:none}
  .decoy{display:none!important}
}

/* =====================================================================
   THE PATIENT CHART
   ===================================================================== */
.chart-wrap{overflow-x:auto;background:#fff;border:1px solid var(--hair);border-radius:var(--r-block);
  box-shadow:var(--shadow);padding:4px 0 0;margin:0 0 6px}
.chart-t{width:100%;border-collapse:collapse;font-size:.92rem}
.chart-t caption{text-align:left;font-family:var(--display);font-weight:800;font-size:.7rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--terra);padding:14px 16px 10px}
.chart-t th,.chart-t td{padding:9px 12px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:middle}
.chart-t thead th{font-family:var(--display);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-muted);border-bottom:1px solid var(--rule);white-space:nowrap}
.chart-t tbody tr:last-child td,.chart-t tbody tr:last-child th{border-bottom:0}
.chart-lab{font-weight:600;color:var(--ink)}
.chart-lab small{display:block;font-weight:400;font-size:.76rem;color:#454B58;margin-top:2px}
.chart-u,.chart-r{font-size:.86rem;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chart-t input{width:6.6em;padding:8px 10px;font-size:.94rem;text-align:right;font-variant-numeric:tabular-nums;
  border:1px solid var(--rule);border-radius:7px;background:#fff;color:var(--ink)}
.chart-t input:disabled{background:var(--off);color:#454B58}
.chart-t input.ok{border-color:var(--teal-text);border-width:2px}
.chart-t input.bad{border-color:var(--terra);border-width:2px;background:rgba(115,23,23,.06)}
.chart-t select{font-family:var(--body);font-size:.9rem;padding:8px 10px;border:1px solid var(--rule);
  border-radius:7px;background:#fff;color:var(--ink);min-width:12.5em}
.chart-t select.ok{border-color:var(--teal-text);border-width:2px}
.chart-t select.bad{border-color:var(--terra);border-width:2px}
.chart-t select:disabled{background:#fff;color:var(--ink);opacity:1;font-weight:600}
.chart-fbrow[hidden]{display:none}
.chart-fb{background:var(--off);border-left:3px solid var(--terra);font-size:.88rem;line-height:1.55;
  color:var(--ink);padding:11px 14px}
.chart-fb b{font-family:var(--display)}

/* the handover the values have to be pulled out of */
.handover{background:#fff;border:1px solid var(--hair);border-left:3px solid var(--navy);
  border-radius:var(--r-block);padding:18px 22px;box-shadow:var(--shadow);margin:0 0 18px;
  font-size:1rem;line-height:1.68}
.handover .hv-k{font-family:var(--display);font-weight:800;font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--terra);display:block;margin-bottom:8px}
.handover p:last-child{margin-bottom:0}

/* =====================================================================
   THE NOTE
   ===================================================================== */
.note-sec{background:#fff;border:1px solid var(--hair);border-radius:var(--r-block);padding:20px 22px;
  box-shadow:var(--shadow);margin:0 0 16px}
.note-sec>h3{margin-bottom:.35em}
.note-opts{display:grid;gap:9px;margin-top:12px}
.note-opt{display:flex;gap:11px;align-items:flex-start;background:var(--off);border:1px solid var(--hair);
  border-radius:8px;padding:12px 14px;cursor:pointer;font-size:.95rem;line-height:1.5}
.note-opt:hover{background:#fff;border-color:var(--navy)}
.note-opt input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--terra);flex:0 0 auto}
.note-opt input:disabled{opacity:1}
.note-sec textarea{width:100%;font-family:var(--body);font-size:1rem;line-height:1.6;padding:14px 16px;
  border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);resize:vertical;margin-top:4px}
.note-sec textarea[readonly]{background:var(--off)}

/* a prompt that folds away while the student writes */
.fold-slot{margin:0 0 14px}
.fold-label{font-family:var(--display);font-weight:800;font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}
.fold-body{font-size:.95rem;line-height:1.6;color:var(--ink)}
.fold-body:empty{display:none}
.fold-body p{margin:0 0 .7em}

@media print{
  .chart-wrap,.note-sec{box-shadow:none;border:1px solid #999}
  .chart-t select,.chart-t input{border:0;padding:0;font-weight:600}
  .chart-fbrow{display:none!important}
  .handover{box-shadow:none;border:1px solid #999}
  .fold-slot .btn{display:none!important}
}

/* =====================================================================
   DRAWING
   Students have no printer. Everything is drawn on screen and every
   canvas is copied into the submitted PDF.
   ===================================================================== */
.dp{margin:16px 0 0}
.dp-inst{font-size:.95rem;line-height:1.6;margin:0 0 14px}
.dp-inst:empty{display:none}
.dp-bar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;background:var(--off);
  border:1px solid var(--hair);border-radius:var(--r-block);padding:12px 15px;margin:0 0 14px}
.dp-tools{display:flex;flex-wrap:wrap;gap:6px}
.dp-t{font-family:var(--display);font-weight:700;font-size:.82rem;background:#fff;color:var(--ink);
  border:1px solid var(--rule);border-radius:7px;padding:8px 13px;cursor:pointer;line-height:1.2}
.dp-t:hover:not(:disabled){border-color:var(--navy);background:#fff}
.dp-t[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.dp-t:disabled{opacity:.5;cursor:default}
.dp-ink{width:30px;height:30px;border-radius:50%;background:var(--ink);border:2px solid #fff;
  box-shadow:0 0 0 1px var(--rule);cursor:pointer;padding:0}
.dp-ink[aria-pressed="true"]{box-shadow:0 0 0 2px var(--navy);transform:scale(1.12)}
.dp-ink:disabled{opacity:.5;cursor:default}
.dp-w{display:flex;align-items:center;gap:9px}
.dp-wl{font-family:var(--display);font-weight:700;font-size:.78rem;color:var(--ink-muted);white-space:nowrap}
.dp-w input{width:110px;accent-color:var(--terra)}
.dp-stage{position:relative;background:#fff;border:1px solid var(--rule);border-radius:var(--r-block);
  overflow:hidden;box-shadow:var(--shadow)}
.dp-bg{position:absolute;inset:0;pointer-events:none}
.dp-bg svg{width:100%;height:100%;display:block}
.dp-canvas{position:absolute;inset:0;cursor:crosshair;touch-action:pan-y}
.dp[data-finger] .dp-canvas{touch-action:none}

/* the described route is an equal answer, so it does not look like a fallback */
.dp-alt{margin:16px 0 0;background:#fff;border:1px solid var(--hair);border-radius:var(--r-block);
  box-shadow:var(--shadow)}
.dp-alt>summary{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--navy);
  padding:14px 17px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.dp-alt>summary::-webkit-details-marker{display:none}
.dp-alt>summary::before{content:"";width:9px;height:9px;border-right:2px solid var(--terra);
  border-bottom:2px solid var(--terra);transform:rotate(-45deg);transition:transform 180ms ease;flex:0 0 auto}
.dp-alt[open]>summary::before{transform:rotate(45deg)}
.dp-alt>summary:hover{background:var(--off)}
.dp-alt-body{padding:0 17px 17px;border-top:1px solid var(--hair)}

<body>

<div id="app"></div>
<noscript><div style="max-width:70ch;margin:40px auto;padding:0 20px;font-family:Helvetica,Arial,sans-serif"><h1>Week 1, Foundations and Whole Body Control</h1><p>This lab is interactive, so it needs JavaScript switched on. Everything it covers is also written out in the course lab manual, which reads and prints without any scripting.</p></div></noscript>
<script>
/* =====================================================================
   THE CLINICAL PHYSIOLOGY LAB, shared engine
   Dr. Sharilyn Rennie, BIO 005 Human Physiology

   Part 1 of 2: helpers, page shell, tabs and gates, progress, plain
   language layer, clickable terms, formulas, multiple choice.

   Every week page loads this file, then adds its own content. Nothing
   in here knows anything about a particular week.
   ===================================================================== */
(function () {
'use strict';

var LAB = {};
window.LAB = LAB;

/* ---------------------------------------------------------------------
   DOM helpers
   --------------------------------------------------------------------- */
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === true) n.setAttribute(k, '');
    else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
    if (c == null) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function fmt(v, d) { if (v == null || isNaN(v)) return '–'; return Number(v).toFixed(d == null ? 2 : d); }
function pct(v) { return Math.round(v) + '%'; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function round(v, d) { var m = Math.pow(10, d || 0); return Math.round(v * m) / m; }

/* deterministic seeded random, so a student's dataset is their own and
   can still be rebuilt later from the case number printed on their work */
function seeded(seed) {
  var s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
function shuffle(arr, rnd) {
  rnd = rnd || Math.random;
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* a fresh four digit case number for this session */
function newCaseNumber() {
  return String(1000 + Math.floor(Math.random() * 9000));
}

LAB.el = el; LAB.$ = $; LAB.$$ = $$; LAB.fmt = fmt; LAB.pct = pct;
LAB.clamp = clamp; LAB.round = round; LAB.seeded = seeded; LAB.shuffle = shuffle;
LAB.newCaseNumber = newCaseNumber;

/* the typeface stack SVG text has to be given explicitly */
LAB.SVG_FONT = 'Helvetica Neue,Helvetica,Arial,sans-serif';
LAB.COLOR = {
  navy: '#0B1530', ink: '#0A1322', muted: '#414B5C',
  terra: '#6E2D24', terraDark: '#5A1212', gold: '#C9A14A', goldText: '#5F4514',
  teal: '#27565D', rule: '#7F8798', ruleSoft: '#DCE0E6', off: '#FAFAF9'
};

/* =====================================================================
   PAGE CONFIG AND SHELL
   The week page hands over a config and a list of sections. The engine
   builds the brand bar, the header, the tab strip and the panels, so
   every week in the course looks and behaves the same way.
   ===================================================================== */
var CFG = {
  course: 'BIO 005',
  courseTitle: 'Human Physiology',
  weekLabel: '',
  title: 'Lab',
  lede: '',
  eyebrow: 'Interactive clinical lab',
  chips: ['Learn', 'Practice', 'Test', 'Submit as PDF'],
  footerNote: 'BIO 005 Human Physiology. Every patient in this lab is fictional. Reference intervals are teaching values and are not for clinical use.'
};
LAB.config = function (o) { for (var k in o) CFG[k] = o[k]; };
LAB.cfg = function () { return CFG; };

var SECTIONS = [];   /* [{id,label,gate,build}] */
LAB.sections = function (list) { SECTIONS = list; };

function logoSVG() {
  return '<svg viewBox="0 0 64 64" role="img" aria-label="Course logo, three figures side by side">' +
    '<circle cx="14" cy="17" r="7.4" fill="#0B1530"/>' +
    '<path d="M14 27.5c-7 0-11.6 4.6-11.6 11.4V57h23.2V38.9c0-6.8-4.6-11.4-11.6-11.4z" fill="#0B1530"/>' +
    '<circle cx="32" cy="12.5" r="8.2" fill="#8B3A2E"/>' +
    '<path d="M32 24c-7.7 0-12.8 5.1-12.8 12.6V57h25.6V36.6C44.8 29.1 39.7 24 32 24z" fill="#8B3A2E"/>' +
    '<circle cx="50" cy="17" r="7.4" fill="#C9A14A"/>' +
    '<path d="M50 27.5c-7 0-11.6 4.6-11.6 11.4V57h23.2V38.9c0-6.8-4.6-11.4-11.6-11.4z" fill="#C9A14A"/></svg>';
}

function buildShell() {
  var app = $('#app');
  if (!app) return;
  var h = [];

  h.push('<a class="skip" href="#main">Skip to the lab</a>');

  h.push('<div class="brandbar"><div class="wrap">' + logoSVG() +
    '<span class="brandlines"><span class="b1">' + CFG.courseTitle + '</span>' +
    '<span class="b2">' + CFG.course + (CFG.weekLabel ? ' · ' + CFG.weekLabel : '') + '</span></span>' +
    '<button type="button" class="hdr-eli" id="eli-all" aria-pressed="false">Explain it to me like I am 10</button>' +
    '<span class="sr-only" id="eli-all-help">Opens a plain language explanation under every concept on the page.</span>' +
    '</div></div>');

  h.push('<header class="site-header on-red"><div class="wrap">' +
    '<p class="eyebrow">' + CFG.eyebrow + '</p>' +
    '<h1>' + CFG.title + '</h1>' +
    (CFG.lede ? '<p class="lede">' + CFG.lede + '</p>' : '') +
    '<div class="badge-row">' + CFG.chips.map(function (c, i) {
      return '<span class="chip' + (i ? ' ghost' : '') + '">' + c + '</span>';
    }).join('') + '</div></div></header>');

  h.push('<nav class="tabbar" aria-label="Lab sections"><div class="wrap">' +
    '<div class="tablist" role="tablist" aria-label="Lab sections">' +
    SECTIONS.map(function (s, i) {
      return '<button class="tab" role="tab" id="tab-' + s.id + '" aria-controls="panel-' + s.id +
        '" aria-selected="' + (i === 0 ? 'true' : 'false') + '"' + (i === 0 ? '' : ' tabindex="-1"') + '>' +
        (i + 1) + '. ' + s.label + '</button>';
    }).join('') +
    '</div><p class="gate-msg" id="gate-msg" role="status" aria-live="polite" hidden></p></div></nav>');

  h.push('<main id="main">' + SECTIONS.map(function (s, i) {
    return '<section class="panel" id="panel-' + s.id + '" role="tabpanel" aria-labelledby="tab-' + s.id +
      '" tabindex="-1"' + (i === 0 ? '' : ' hidden') + '><div class="wrap" id="' + s.id + '-root"></div></section>';
  }).join('') + '</main>');

  h.push('<footer class="site-footer"><div class="wrap">' +
    '<p class="name">Dr. Sharilyn Rennie</p>' +
    '<p>Professor of Anatomy &amp; Physiology</p>' +
    '<p class="muted">' + CFG.footerNote + '</p></div></footer>');

  app.innerHTML = h.join('\n');
}

/* =====================================================================
   PROGRESS
   Session only. Nothing is stored and nothing is transmitted. Buckets
   are registered by the week page in the order they should appear on
   the results page.
   ===================================================================== */
var BUCKETS = [];
function bucket(key, label) {
  var b = { key: key, label: label, right: 0, asked: 0 };
  BUCKETS.push(b);
  return b;
}
function score(b, correct) {
  b.asked++; if (correct) b.right++;
  var rp = $('#report-root');
  if (rp && rp.dataset.built === '1') LAB.renderReport();
}
var quiz = { right: 0, asked: 0, byObjective: {}, missed: [] };
LAB.bucket = bucket; LAB.score = score; LAB.quiz = quiz;
LAB.buckets = function () { return BUCKETS; };

/* =====================================================================
   TABS AND THE GUIDED SEQUENCE
   A section can name a gate it waits on. Gates open when the week page
   calls LAB.openGate. Once open, a section stays open.
   ===================================================================== */
var gates = {};
var GATE_INFO = {};
LAB.gates = gates;
LAB.gateInfo = function (name, info) { GATE_INFO[name] = info; gates[name] = false; };

function gateOf(id) {
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i].gate;
  return null;
}
function isOpen(id) {
  var need = gateOf(id);
  return !need || gates[need] === true;
}

var gateMsgTimer = null;
function sayGate(text, actionLabel, actionTab) {
  var box = $('#gate-msg');
  if (!box) return;
  box.innerHTML = '';
  box.appendChild(el('span', { html: text }));
  if (actionLabel) {
    box.appendChild(el('button', {
      class: 'btn sm', type: 'button', text: actionLabel,
      onclick: function () { showTab(actionTab, true); }
    }));
  }
  box.hidden = false;
  if (gateMsgTimer) clearTimeout(gateMsgTimer);
  gateMsgTimer = setTimeout(function () { box.hidden = true; }, 14000);
}

function refreshLocks() {
  SECTIONS.forEach(function (s) {
    var tab = $('#tab-' + s.id);
    if (!tab) return;
    if (isOpen(s.id)) {
      tab.removeAttribute('data-locked');
      var sr = tab.querySelector('.sr-only');
      if (sr) sr.remove();
    } else {
      /* deliberately not aria-disabled. A closed tab still does something
         useful: it says what has to be finished first and takes you there. */
      tab.setAttribute('data-locked', 'true');
      if (!tab.querySelector('.sr-only')) {
        tab.appendChild(el('span', {
          class: 'sr-only',
          text: ', not open yet, selecting this explains what to finish first'
        }));
      }
    }
  });
}

function openGate(which) {
  if (gates[which]) return;
  gates[which] = true;
  refreshLocks();
  var info = GATE_INFO[which] || {};
  var firstOpened = null;
  for (var i = 0; i < SECTIONS.length; i++) {
    if (SECTIONS[i].gate === which) { firstOpened = SECTIONS[i].id; break; }
  }
  if (firstOpened) {
    var tab = $('#tab-' + firstOpened);
    if (tab) {
      tab.classList.add('just-opened');
      setTimeout(function () { tab.classList.remove('just-opened'); }, 9000);
    }
  }
  if (info.openMsg) sayGate(info.openMsg, info.openLabel, info.openGoto || firstOpened);
}

function showTab(name, focusPanel) {
  if (!isOpen(name)) {
    var g = GATE_INFO[gateOf(name)] || {};
    sayGate(g.msg || 'That section is not open yet.', g.label, g.goto);
    if (g.goto && g.goto !== name) showTab(g.goto, true);
    return;
  }
  SECTIONS.forEach(function (s) {
    var tab = $('#tab-' + s.id), panel = $('#panel-' + s.id);
    if (!tab || !panel) return;
    var on = (s.id === name);
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
    panel.hidden = !on;
  });
  if (name === 'report' && LAB.renderReport) LAB.renderReport();
  if (focusPanel) { var p = $('#panel-' + name); if (p) p.focus(); }
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function initTabs() {
  SECTIONS.forEach(function (s, i) {
    var tab = $('#tab-' + s.id);
    if (!tab) return;
    tab.addEventListener('click', function () { showTab(s.id); });
    tab.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 :
              e.key === 'Home' ? -99 : e.key === 'End' ? 99 : 0;
      if (!d) return;
      e.preventDefault();
      var j = d === -99 ? 0 : d === 99 ? SECTIONS.length - 1 : (i + d + SECTIONS.length) % SECTIONS.length;
      $('#tab-' + SECTIONS[j].id).focus();
      showTab(SECTIONS[j].id);
    });
  });
  refreshLocks();
}
LAB.showTab = showTab; LAB.openGate = openGate; LAB.isOpen = isOpen; LAB.sayGate = sayGate;

/* =====================================================================
   PLAIN LANGUAGE LAYER
   Every idea on the page can be opened up in everyday words, one button
   at a time or all at once from the header.
   ===================================================================== */
var eliBlocks = [];
function eli(paragraphs) {
  var box = el('div', { class: 'eli-box' });
  box.appendChild(el('span', { class: 'eli-head', text: 'In plain words' }));
  (Array.isArray(paragraphs) ? paragraphs : [paragraphs]).forEach(function (t) {
    box.appendChild(el('p', { html: t }));
  });
  box.hidden = true;
  var btn = el('button', {
    class: 'eli-toggle', type: 'button', 'aria-expanded': 'false',
    onclick: function () { setOne(btn.getAttribute('aria-expanded') !== 'true'); }
  }, 'Explain it to me like I am 10');
  function setOne(open) {
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    box.hidden = !open;
    btn.textContent = open ? 'Hide the plain words' : 'Explain it to me like I am 10';
  }
  eliBlocks.push({ set: setOne });
  return el('div', null, [btn, box]);
}
function eliIcon(paragraphs, label) {
  var box = el('div', { class: 'eli-box', style: 'margin:10px 0 0' });
  box.appendChild(el('span', { class: 'eli-head', text: 'In plain words' }));
  (Array.isArray(paragraphs) ? paragraphs : [paragraphs]).forEach(function (t) {
    box.appendChild(el('p', { html: t }));
  });
  box.hidden = true;
  var btn = el('button', {
    class: 'fx-info', type: 'button', 'aria-expanded': 'false',
    'aria-label': 'Explain ' + (label || 'this') + ' in plain words',
    onclick: function () { setOne(btn.getAttribute('aria-expanded') !== 'true'); }
  }, 'i');
  function setOne(open) {
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    box.hidden = !open;
  }
  eliBlocks.push({ set: setOne });
  return { btn: btn, box: box };
}
function eliAll(open) { eliBlocks.forEach(function (r) { r.set(open); }); }
function initEli() {
  var master = $('#eli-all');
  if (!master) return;
  master.setAttribute('aria-describedby', 'eli-all-help');
  master.addEventListener('click', function () {
    var on = master.getAttribute('aria-pressed') !== 'true';
    master.setAttribute('aria-pressed', on ? 'true' : 'false');
    master.textContent = on ? 'Back to the clinical wording' : 'Explain it to me like I am 10';
    eliAll(on);
  });
}
LAB.eli = eli; LAB.eliIcon = eliIcon; LAB.eliAll = eliAll;

/* =====================================================================
   CLICKABLE TERMS
   Write <t>baroreceptor</t> anywhere in a string. It becomes a red word
   the student can click for a one line definition, so the sentence
   around it stays short instead of carrying the explanation.
   ===================================================================== */
var GLOSSARY = {
  /* words that come up in more than one week live here. A week page adds
     its own with LAB.addTerms. */
  'homeostasis': 'Keeping something steady inside the body while the world outside keeps changing.',
  'set point': 'The value the body is aiming for, like the temperature you set on a thermostat.',
  'negative feedback': 'The body pushes back against whatever moved. Too hot, it cools. Too cold, it warms.',
  'positive feedback': 'The body pushes in the same direction as the change, so it snowballs. Rare, and it needs an event to end it.',
  'sensor': 'The part that measures. It only reports, it never fixes anything.',
  'integrator': 'The part that compares the reading against the set point and decides what to do. Usually the brain.',
  'effector': 'The part that actually does something about it. A muscle, a gland, a vessel.',
  'regulated variable': 'The one thing the loop is defending. Not the sensor, not the response, the number itself.',
  'baroreceptor': 'A stretch sensor in the wall of a big artery that reports blood pressure to the brain.',
  'mean arterial pressure': 'The average pushing pressure across one whole heartbeat. This is the number organs actually feel.',
  'pulse pressure': 'The size of the jump between the top number and the bottom number.',
  'systolic': 'The peak pressure, while the heart is squeezing.',
  'diastolic': 'The lowest pressure, while the heart is filling.',
  'cardiac output': 'How much blood the heart pumps in a minute. Heart rate multiplied by the amount per beat.',
  'stroke volume': 'How much blood leaves the heart with one beat.',
  'perfusion': 'Blood actually arriving at a tissue. Pressure is the push, perfusion is the delivery.',
  'hemoglobin': 'The protein inside red blood cells that carries oxygen. Sometimes spelled hemoglobin.',
  'saturation': 'The share of oxygen seats on hemoglobin that are filled. Reported as a percent.',
  'partial pressure': 'How hard a gas is pushing to get somewhere. Oxygen moves from higher push to lower push.',
  'hypoxaemia': 'Not enough oxygen in the blood.',
  'hypoxia': 'Not enough oxygen arriving where it is needed. Blood levels can look fine and this can still be true.',
  'orthostatic': 'Caused by standing up.',
  'reflex': 'A fast, automatic correction that happens before you notice anything.',
  'sympathetic': 'The fast, go, get ready branch of the nervous system. Raises rate, tightens vessels.',
  'parasympathetic': 'The slow it back down branch. Lowers heart rate, runs digestion.',
  'vasoconstriction': 'Vessels narrowing, which raises pressure and sends blood elsewhere.',
  'vasodilation': 'Vessels widening, which lowers pressure and lets more blood into that tissue.',
  'lower limit of normal': 'The line below the bottom 5 out of every 100 healthy people. Below it is genuinely unusual.',
  'predicted': 'What a healthy person of the same height, age and sex would be expected to do.'
};
LAB.addTerms = function (obj) { for (var k in obj) GLOSSARY[k.toLowerCase()] = obj[k]; };
LAB.GLOSSARY = GLOSSARY;

var termSeq = 0;
function wireTerms(root) {
  $$('t', root).forEach(function (n) {
    var word = (n.getAttribute('k') || n.textContent).toLowerCase().trim();
    var def = GLOSSARY[word];
    if (!def) { n.outerHTML = n.innerHTML; return; }
    var id = 'td' + (++termSeq);
    var btn = el('button', {
      class: 'term', type: 'button', 'aria-expanded': 'false', 'aria-controls': id,
      text: n.textContent
    });
    var box = el('span', { class: 'term-def', id: id, html: '<b>' + n.textContent + '.</b> ' + def });
    box.hidden = true;
    btn.addEventListener('click', function () {
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      box.hidden = open;
    });
    var wrap = document.createDocumentFragment();
    wrap.appendChild(btn); wrap.appendChild(box);
    n.parentNode.replaceChild(wrap, n);
  });
}
LAB.wireTerms = wireTerms;

/* =====================================================================
   BUILDING BLOCKS
   ===================================================================== */
function card(kids, cls) { return el('div', { class: 'card' + (cls ? ' ' + cls : '') }, kids); }
function surface(kids, cls) { return el('div', { class: 'surface' + (cls ? ' ' + cls : '') }, kids); }
function kicker(t, cls) { return el('p', { class: 'kicker' + (cls ? ' ' + cls : ''), text: t }); }
function note(t) { return el('p', { class: 'note', html: t }); }
function para(t, cls) { return el('p', cls ? { class: cls, html: t } : { html: t }); }
function list(items, ordered, cls) {
  return el(ordered ? 'ol' : 'ul', { class: 'tight' + (cls ? ' ' + cls : '') },
    items.map(function (i) { return el('li', { html: i }); }));
}
LAB.card = card; LAB.surface = surface; LAB.kicker = kicker;
LAB.note = note; LAB.para = para; LAB.list = list;

/* a formula block: the equation, one line of what it tells you, an
   abbreviation key, and an info button holding the plain words */
function fx(eq, what, key, plain) {
  var info = plain ? eliIcon(plain, 'this formula') : null;
  var top = el('div', { class: 'fx-top' }, [
    el('p', { class: 'fx-eq', html: eq }),
    info ? info.btn : null
  ]);
  var legend = null;
  if (key && key.length) {
    legend = el('p', { class: 'fx-key' }, key.map(function (k) {
      return el('span', { html: '<b>' + k[0] + '</b> ' + k[1] });
    }));
  }
  return el('div', { class: 'fx' }, [
    top,
    what ? el('p', { class: 'fx-note', html: what }) : null,
    legend,
    info ? info.box : null
  ]);
}
function frac(n, d) {
  return '<span class="frac"><span class="num">' + n + '</span><span class="den">' + d + '</span></span>';
}
LAB.fx = fx; LAB.frac = frac;

/* collapsible block */
function disclosure(title, bodyNodes, openByDefault) {
  var body = el('div', { class: 'body' }, bodyNodes);
  var mark = el('span', { class: 'mark', text: openByDefault ? '–' : '+' });
  var btn = el('button', {
    type: 'button', 'aria-expanded': openByDefault ? 'true' : 'false',
    onclick: function () {
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      body.hidden = open; mark.textContent = open ? '+' : '–';
    }
  }, [el('span', { text: title }), mark]);
  body.hidden = !openByDefault;
  return el('div', { class: 'disc' }, [btn, body]);
}
LAB.disclosure = disclosure;

/* multiple choice */
function mcq(cfg) {
  var answered = false;
  var listEl = el('ul', { class: 'opts' });
  var fb = el('div', { class: 'fb', 'aria-live': 'polite' });
  fb.hidden = true;
  var buttons = [];
  cfg.options.forEach(function (o, i) {
    var b = el('button', {
      class: 'opt', type: 'button',
      onclick: function () {
        if (answered) return;
        answered = true;
        buttons.forEach(function (bb, j) {
          bb.disabled = true;
          if (j === cfg.correct) bb.className = 'opt correct';
          else if (j === i) bb.className = 'opt wrong';
        });
        var right = i === cfg.correct;
        fb.hidden = false;
        fb.innerHTML = '<strong>' + (right ? 'Correct. ' : 'Not quite. ') + '</strong>' + cfg.explain;
        wireTerms(fb);
        if (cfg.bucket) score(cfg.bucket, right);
        if (cfg.onAnswer) cfg.onAnswer(right, i);
      }
    }, [el('span', { class: 'ltr', text: 'ABCDEF'[i] }), el('span', { text: o })]);
    buttons.push(b);
    listEl.appendChild(el('li', null, b));
  });
  return el('div', null, [
