<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting to the course home &middot; BIO 005</title>
<link rel="canonical" href="course-start.html">
<meta http-equiv="refresh" content="0; url=course-start.html">
<link rel="stylesheet" href="assets/fonts-site.css">
<!--
  ============================================================
  BIO 005 Human Physiology, Yuba College, Fall 2026
  welcome.html   REDIRECT ONLY

  This used to be the course home and the root of the nav map,
  and 40 pages linked to it. On Sep 6 2026 course-start.html
  took over as the front page. Rather than leave 40 links
  pointing at a page wearing a "this page has moved" banner,
  the links were repointed and this file became a redirect, so
  any bookmark, any Canvas embed and any link printed on paper
  still lands somewhere correct.

  The page that used to live here, greeting hero, Hootie and the
  eight part tour, is intact at welcome-tour.html. Nothing was
  deleted.

  It redirects the FRAME, not the top window, so a Canvas embed
  of this URL keeps working inside Canvas instead of breaking
  the student out of it.
  ============================================================
-->
<style>
:root{--navy:#0B1530;--maroon-dark:#6E2D24;--muted:#454B58;--hair:#D8DBE2}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#FAFAF9;color:var(--navy);line-height:1.6;
     font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
     display:grid;place-items:center;min-height:100vh;padding:32px 20px}
.card{background:#fff;border:1px solid var(--hair);padding:30px 32px;max-width:52ch;text-align:center}
h1{font-family:'Open Sans',system-ui,sans-serif;font-weight:800;font-size:23px;
   letter-spacing:-.02em;margin:0 0 10px}
p{margin:0 0 16px;color:var(--muted);font-size:15.5px}
a.btn{display:inline-block;background:var(--maroon-dark);color:#fff;text-decoration:none;
      font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      padding:14px 22px;border-radius:4px}          /* white on #6E2D24 is 10.18:1 */
a.btn:hover{background:#8B3A2E}
a.plain{color:var(--maroon-dark);font-weight:700}
:focus-visible{outline:3px solid #8B3A2E;outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <h1>The course home moved.</h1>
  <p>Taking you to the new front page now. If nothing happens, use the button.</p>
  <p><a class="btn" href="course-start.html">Go to the course home</a></p>
  <p style="margin:0;font-size:14px">Looking for the welcome tour that used to be here?
    <a class="plain" href="welcome-tour.html">It is still here</a>.</p>
</main>
<script>
/* Replace, not assign, so the browser Back button does not bounce the student
   straight back into this redirect. The frame, not the top window, so a Canvas
   embed of the old URL keeps working inside Canvas. */
location.replace("course-start.html");
</script>
</body>
</html>
